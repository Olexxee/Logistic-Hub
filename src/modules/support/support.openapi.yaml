openapi: 3.1.0
info:
  title: Logistic Hub Support API
  version: 1.0.0
paths:
  /support/tickets/{ticketId}/messages:
    get:
      operationId: listSupportTicketMessages
      summary: List ticket conversation messages
      description: Customers can read only their own public messages. ADMIN and SUPPORT can also read internal notes.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Ticket messages returned with role-based visibility. }
        '401': { description: Authentication required. }
        '404': { description: Ticket not found or not accessible. }
    post:
      operationId: createSupportTicketMessage
      summary: Add a public reply or internal note
      description: Customers may create PUBLIC replies only. ADMIN and SUPPORT may create PUBLIC replies or INTERNAL notes. Closed tickets reject messages.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [body]
              properties:
                visibility: { type: string, enum: [PUBLIC, INTERNAL], default: PUBLIC }
                body: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '201': { description: Message created and audit event recorded. }
        '400': { description: Invalid message payload. }
        '401': { description: Authentication required. }
        '403': { description: Internal notes are restricted to support staff. }
        '404': { description: Ticket not found or not accessible. }
        '409': { description: Ticket is closed. }

  /support/tickets/{ticketId}/attachments:
    get:
      operationId: listSupportTicketAttachments
      summary: List private evidence attached to a support ticket
      description: Customers can list attachments on their own tickets. ADMIN and SUPPORT can list attachments for tickets they can access.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Evidence metadata; storage paths and public URLs are never returned. }
        '401': { description: Authentication required. }
        '404': { description: Ticket not found or not accessible. }
    post:
      operationId: uploadSupportTicketAttachment
      summary: Upload private evidence to a support ticket
      description: Upload raw file bytes as application/octet-stream. Supply x-file-content-type and x-file-name headers. JPEG, PNG, WebP and PDF files up to 10 MB are accepted after content-signature validation.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: x-file-content-type
          required: true
          schema: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        - in: header
          name: x-file-name
          required: true
          schema: { type: string, maxLength: 160 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Evidence stored privately and metadata/audit event persisted. }
        '400': { description: Invalid evidence content or closed ticket. }
        '401': { description: Authentication required. }
        '404': { description: Ticket not found or not accessible. }
        '413': { description: Evidence exceeds 10 MB. }
        '415': { description: Unsupported upload content type. }
        '503': { description: Firebase Storage is not configured or unavailable. }
  /support/tickets/{ticketId}/attachments/{attachmentId}/download:
    get:
      operationId: downloadSupportTicketAttachment
      summary: Download private support-ticket evidence
      description: Downloads evidence only after ticket ownership or ADMIN/SUPPORT access is verified. Download access is audited.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: path
          name: attachmentId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Private evidence bytes.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { description: Authentication required. }
        '404': { description: Ticket or attachment not found or not accessible. }
        '503': { description: Firebase Storage is unavailable. }

  /support/admin/tickets/{ticketId}/escalate:
    post:
      operationId: escalateSupportTicketToOperationalCase
      summary: Escalate a parcel support ticket into an operational case
      description: ADMIN and SUPPORT may create one linked operational case for a ticket associated with a parcel booking. Repeated requests return the existing case. Ride tickets cannot be escalated through this parcel operational-case workflow.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: ticketId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [caseType]
              properties:
                caseType: { type: string, enum: [FAILED_HANDOVER, DAMAGED_PARCEL, MISSING_PARCEL, FAILED_DELIVERY, PARTNER_DELAY, ROUTE_DISRUPTION, PRICING_EXCEPTION, CUSTOMER_DISPUTE, OTHER] }
                priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL], default: NORMAL }
      responses:
        '201': { description: Operational case created and linked to the support ticket; both actions audited. }
        '200': { description: Existing linked operational case returned for an idempotent replay. }
        '400': { description: Invalid escalation payload. }
        '401': { description: Authentication required. }
        '403': { description: ADMIN or SUPPORT role required. }
        '404': { description: Support ticket not found. }
        '409': { description: Ticket is not linked to a valid parcel booking or already has a conflicting escalation. }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
