  /parcel-bookings:
    get:
      tags: [Parcel bookings]
      operationId: listParcelBookings
      summary: List parcel bookings visible to the authenticated user
      description: |
        Customers receive only their own bookings. Admin and support roles may list
        all bookings. Results are ordered newest first and paginated. Admin/support may also filter
        by payment status, public reference, service zones and creation date range.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, AWAITING_PARTNER_ASSIGNMENT, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
        - in: query
          name: paymentStatus
          schema: { type: string, enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED] }
        - in: query
          name: reference
          schema: { type: string, minLength: 2, maxLength: 64 }
        - in: query
          name: pickupServiceZoneId
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: destinationServiceZoneId
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: createdFrom
          schema: { type: string, format: date-time }
        - in: query
          name: createdTo
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Page of bookings visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParcelBookingCreated'
                      pagination:
                        type: object
                        required: [page, limit, total, totalPages]
                        properties:
                          page: { type: integer, minimum: 1 }
                          limit: { type: integer, minimum: 1, maximum: 100 }
                          total: { type: integer, minimum: 0 }
                          totalPages: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Parcel bookings]
      operationId: createParcelBooking
      summary: Create a draft parcel booking
      description: |
        The server validates both service zones and current parcel-service availability.
        The client cannot set status, payment status, price snapshots or driver assignment.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - pickupServiceZoneId
                - destinationServiceZoneId
                - pickupAddress
                - pickup
                - destinationAddress
                - destination
                - recipientName
                - recipientPhone
                - parcelCategory
                - parcelSize
              properties:
                pickupServiceZoneId:
                  type: string
                  minLength: 1
                destinationServiceZoneId:
                  type: string
                  minLength: 1
                pickupAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                pickup:
                  $ref: '#/components/schemas/Coordinates'
                pickupInstructions:
                  type: string
                  maxLength: 1000
                destinationAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                destination:
                  $ref: '#/components/schemas/Coordinates'
                recipientName:
                  type: string
                  minLength: 1
                  maxLength: 160
                recipientPhone:
                  type: string
                  minLength: 7
                  maxLength: 32
                parcelCategory:
                  type: string
                  minLength: 1
                  maxLength: 80
                parcelDescription:
                  type: string
                  maxLength: 2000
                parcelSize:
                  type: string
                  minLength: 1
                  maxLength: 80
                declaredValueMinor:
                  $ref: '#/components/schemas/MinorAmount'
                handlingInstructions:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Draft booking created; payment has not been initiated.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ParcelBookingCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Idempotency conflict or requested service zone is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
