      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proposedFareMinor, currency]
              properties:
                proposedFareMinor:
                  $ref: '#/components/schemas/PositiveMinorAmount'
                currency:
                  type: string
                  const: NGN
      responses:
        '200':
          description: Fare proposal recorded with server-generated expiry.
          content:
