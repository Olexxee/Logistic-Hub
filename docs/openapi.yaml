openapi: 3.1.0
info:
  title: Logistic Hub API
  version: 1.0.0
  description: |
    Versioned backend contract for Logistic Hub. Planned endpoints are specifications,
    not proof of implementation. Monetary amounts are decimal strings representing
    integer minor units (kobo for NGN).
servers:
  - url: /api/v1
    description: Configure the host for each environment.
tags:
  - name: Health
  - name: Geography
  - name: Maps
  - name: Authentication
  - name: Parcel bookings
  - name: Driver offers
  - name: Payments
  - name: Drivers
  - name: Admin
  - name: Hub points
  - name: Notifications
  - name: Webhooks
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process health
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Process health only; database readiness is reported separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database readiness
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: PostgreSQL readiness confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [service, status, dependencies, timestamp]
                    properties:
                      service: { const: logistic-hub-api }
                      status: { const: ready }
                      dependencies:
                        type: object
                        required: [database]
                        properties:
                          database: { const: ok }
                      timestamp: { type: string, format: date-time }
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /service-zones:
    get:
      tags: [Geography]
      operationId: listActiveServiceZones
      summary: List active service zones and service availability
      x-implementation-status: implemented
      parameters:
        - in: query
          name: countryCode
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            default: NG
        - in: query
          name: stateCode
          description: ISO 3166-2 subdivision code, such as NG-LA.
          schema:
            type: string
            pattern: '^NG-[A-Z]{2}$'
        - in: query
          name: lgaCode
          schema:
            type: string
        - in: query
          name: serviceType
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: Active zones only; reference geography without active service is excluded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceZone'
        '400':
          $ref: '#/components/responses/ValidationError'
  /maps/geocode:
    post:
      tags: [Maps]
      operationId: geocodeAddress
      summary: Convert an address to candidate coordinates
      description: Geocoding does not establish service-zone eligibility.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Normalized geocoding result.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/GeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No candidate location was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /maps/routes:
    post:
      tags: [Maps]
      operationId: computeRoute
      summary: Estimate route distance and duration
      description: Route distance and duration are estimates, not fare guarantees.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin, destination]
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
                travelMode:
                  type: string
                  enum: [DRIVE, TWO_WHEELER, WALK, BICYCLE]
                  default: DRIVE
      responses:
        '200':
          description: Normalized route estimate.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RouteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerCustomer
      summary: Register a customer and send an email verification link
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName, email, password]
              properties:
                fullName: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '201':
          description: Account created; verification email accepted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email is already registered.
        '503':
          description: Email service is unavailable.
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address using a one-time token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Email verified and account activated.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a verified active account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Short-lived bearer access token and public account profile.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is not active or email is not verified.
        '503':
          description: Authentication signing is not configured.
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Generic response that does not disclose whether the account exists.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password using a one-time reset token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Password reset successfully.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: Return the authenticated account profile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account profile.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drivers/me:
    get:
      tags: [Drivers]
      operationId: getMyDriverProfile
      summary: Read the authenticated user's driver profile and onboarding status
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: "Driver profile, or null if onboarding has not started." }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /drivers/onboarding:
    post:
      tags: [Drivers]
      operationId: submitDriverOnboarding
      summary: Submit a driver profile and vehicle for review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle]
              properties:
                serviceRadiusMeters: { type: integer, minimum: 500, maximum: 100000, default: 5000 }
                vehicle:
                  type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type: { type: string, enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK] }
                    make: { type: string, maxLength: 80 }
                    model: { type: string, maxLength: 80 }
                    registrationPlate: { type: string, minLength: 2, maxLength: 32 }
                    parcelCapacity: { type: string, maxLength: 80 }
      responses:
        '201': { description: Onboarding submitted; driver and vehicle await admin review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Driver profile or vehicle already exists. }
  /drivers/availability:
    patch:
      tags: [Drivers]
      operationId: setDriverAvailability
      summary: Set online and available status for a verified driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isOnline, isAvailable]
              properties:
                isOnline: { type: boolean }
                isAvailable: { type: boolean }
      responses:
        '200': { description: Updated online and available state. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Driver is not ready for dispatch. }
  /drivers/location:
    post:
      tags: [Drivers]
      operationId: recordDriverLocation
      summary: Record a location update for a verified online driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracyMeters: { type: number, minimum: 0, maximum: 10000 }
      responses:
        '201': { description: Location recorded; response includes timestamp. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/admin/{driverProfileId}/verification:
    patch:
      tags: [Admin]
      operationId: reviewDriverVerification
      summary: Approve or reject driver verification
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverProfileId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationStatus]
              properties:
                verificationStatus: { type: string, enum: [VERIFIED, REJECTED] }
      responses:
        '200': { description: Driver verification updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/vehicles/{vehicleId}/verification:
    patch:
      tags: [Admin]
      operationId: reviewVehicleVerification
      summary: Approve or reject a driver's vehicle
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationStatus]
              properties:
                verificationStatus: { type: string, enum: [VERIFIED, REJECTED] }
      responses:
        '200': { description: Vehicle verification updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/coverage:
    put:
      tags: [Admin]
      operationId: setDriverCoverage
      summary: Enable or disable service-zone coverage for a driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driverProfileId, serviceZoneId, serviceType, isEnabled]
              properties:
                driverProfileId: { type: string }
                serviceZoneId: { type: string }
                serviceType: { $ref: '#/components/schemas/ServiceType' }
                isEnabled: { type: boolean }
      responses:
        '200': { description: Driver coverage upserted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /hub-points:
    get:
      tags: [Hub points]
      operationId: listActiveHubPoints
      summary: List active parcel drop-off and collection points
      description: Only active hub points in active zones with current parcel-service availability are returned.
      x-implementation-status: implemented
      security: []
      parameters:
        - in: query
          name: countryCode
          schema: { type: string, minLength: 2, maxLength: 2, default: NG }
        - in: query
          name: stateCode
          schema: { type: string, minLength: 5, maxLength: 5 }
        - in: query
          name: lgaName
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: serviceZoneId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Active hub points with zone, LGA, state and country labels.
        '400':
          $ref: '#/components/responses/ValidationError'
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: List notifications for the authenticated account
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Notification page and unread count for the authenticated account.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    patch:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: Mark one owned notification as read
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: notificationId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Notification marked read; repeated requests are safe.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all notifications for the authenticated account as read
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Number of unread notifications marked read.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /parcel-bookings:
    get:
      tags: [Parcel bookings]
      operationId: listParcelBookings
      summary: List parcel bookings visible to the authenticated user
      description: |
        Customers receive only their own bookings. Admin and support roles may list
        all bookings. Results are ordered newest first and paginated; the optional
        status filter is applied server-side.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: status
          required: false
          schema:
            type: string
            enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
      responses:
        '200':
          description: Page of bookings visible to the caller.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/ParcelBookingCreated'
                      pagination:
                        type: object
                        required: [page, limit, total, totalPages]
                        properties:
                          page: { type: integer, minimum: 1 }
                          limit: { type: integer, minimum: 1, maximum: 100 }
                          total: { type: integer, minimum: 0 }
                          totalPages: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Parcel bookings]
      operationId: createParcelBooking
      summary: Create a draft parcel booking
      description: |
        The server validates both service zones and current parcel-service availability.
        The client cannot set status, payment status, price snapshots or driver assignment.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - pickupServiceZoneId
                - destinationServiceZoneId
                - pickupAddress
                - pickup
                - destinationAddress
                - destination
                - recipientName
                - recipientPhone
                - parcelCategory
                - parcelSize
              properties:
                pickupServiceZoneId:
                  type: string
                  minLength: 1
                destinationServiceZoneId:
                  type: string
                  minLength: 1
                pickupAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                pickup:
                  $ref: '#/components/schemas/Coordinates'
                pickupInstructions:
                  type: string
                  maxLength: 1000
                destinationAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                destination:
                  $ref: '#/components/schemas/Coordinates'
                recipientName:
                  type: string
                  minLength: 1
                  maxLength: 160
                recipientPhone:
                  type: string
                  minLength: 7
                  maxLength: 32
                parcelCategory:
                  type: string
                  minLength: 1
                  maxLength: 80
                parcelDescription:
                  type: string
                  maxLength: 2000
                parcelSize:
                  type: string
                  minLength: 1
                  maxLength: 80
                declaredValueMinor:
                  $ref: '#/components/schemas/MinorAmount'
                handlingInstructions:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Draft booking created; payment has not been initiated.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ParcelBookingCreated'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Idempotency conflict or requested service zone is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /parcel-bookings/{bookingId}:
    get:
      tags: [Parcel bookings]
      operationId: getParcelBooking
      summary: Get a parcel booking and its current lifecycle state
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking resource visible to its sender or an authorized operator.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ParcelBookingResource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /parcel-bookings/{bookingId}/request-matching:
    post:
      tags: [Driver offers]
      operationId: requestParcelMatching
      summary: Request offers from eligible drivers for a draft parcel booking
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '202':
          description: Matching requested; offers have a finite expiry window.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Booking state conflict or no eligible drivers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /parcel-bookings/{bookingId}/offers:
    get:
      tags: [Driver offers]
      operationId: listParcelFareOffers
      summary: List fare offers visible to the booking sender
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Offers for the caller's booking.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FareOffer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /driver/offers:
    get:
      tags: [Driver offers]
      operationId: listDriverOffers
      summary: List current offers for the authenticated driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Offers for the authenticated and eligible driver.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
