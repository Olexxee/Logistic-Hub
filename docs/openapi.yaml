    post:
      tags: [Partner settlement]
      operationId: reconcilePartnerSettlementBatch
      summary: Record an evidence-backed settlement reconciliation result
      description: MATCHED requires the exact expected batch amount and an external statement or transfer reference. VARIANCE and DISPUTED outcomes keep payables disputed. This records internal reconciliation only; it does not initiate or confirm a provider payout.
      security: [{ bearerAuth: [] }]
      x-implementation-status: implemented
      parameters:
        - { name: batchId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
