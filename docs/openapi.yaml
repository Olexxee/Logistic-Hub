                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items, nextCursor]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, publicReference, type, status, priority, title, description, createdAt]
                          properties:
                            id: { type: string }
                            publicReference: { type: string }
                            type: { type: string }
                            status: { type: string, enum: [OPEN, TRIAGED, IN_PROGRESS, RESOLVED, CLOSED] }
                            priority: { type: string, enum: [LOW, NORMAL, HIGH, CRITICAL] }
                            title: { type: string }
                            description: { type: string }
                            resolution: { type: [string, 'null'] }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                            assignedTo: { type: [object, 'null'] }
                            reportedBy: { type: object }
                          additionalProperties: true
                      nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
