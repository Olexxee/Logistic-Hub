openapi: 3.1.0
info:
  title: Logistic Hub API
  version: 1.0.0
  description: |
    Initial contract baseline for the Logistic Hub backend. Paths marked planned
    are design contracts and are not implemented endpoints. Amounts are decimal
    strings representing integer minor currency units (kobo for NGN).
servers:
  - url: /api/v1
    description: API base path; configure the host per environment.
tags:
  - name: Health
  - name: Geography
  - name: Maps
  - name: Parcel bookings
  - name: Driver offers
  - name: Payments
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      security: []
      summary: Check process health
      x-implementation-status: implemented
      responses:
        '200':
          description: Process is running. This does not guarantee database readiness.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /service-zones:
    get:
      tags: [Geography]
      operationId: listActiveServiceZones
      summary: List active service zones and service availability
      x-implementation-status: planned
      parameters:
        - in: query
          name: countryCode
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            default: NG
        - in: query
          name: stateCode
          description: ISO 3166-2 subdivision code, for example NG-LA.
          schema:
            type: string
            pattern: '^NG-[A-Z]{2}$'
        - in: query
          name: lgaCode
          schema:
            type: string
        - in: query
          name: serviceType
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: Matching active service zones. Reference geography without active service is excluded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceZone'
        '400':
          $ref: '#/components/responses/ValidationError'
  /maps/geocode:
    post:
      tags: [Maps]
      operationId: geocodeAddress
      summary: Convert a user-supplied address to candidate coordinates
      description: The result is not proof that the address is inside an active service zone.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Normalized geocoding result
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/GeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: No candidate location was found.
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
  /maps/routes:
    post:
      tags: [Maps]
      operationId: computeRoute
      summary: Estimate road or path distance and duration
      description: Distance and duration are estimates, not fare guarantees.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [origin, destination]
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
                travelMode:
                  type: string
                  enum: [DRIVE, TWO_WHEELER, WALK, BICYCLE]
                  default: DRIVE
      responses:
        '200':
          description: Normalized route estimate
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RouteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
  /parcel-bookings:
    post:
      tags: [Parcel bookings]
      operationId: createParcelBooking
      summary: Create a draft parcel booking
      description: |
        Both pickup and destination must resolve to active service zones for the
        requested service. The server validates the zones; clients cannot set
        booking/payment status, price snapshots, driver assignment or payment state.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pickupServiceZoneId
                - destinationServiceZoneId
                - pickupAddress
                - pickup
                - destinationAddress
                - destination
                - recipientName
                - recipientPhone
                - parcelCategory
                - parcelSize
              properties:
                pickupServiceZoneId:
                  type: string
                destinationServiceZoneId:
                  type: string
                pickupAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                pickup:
                  $ref: '#/components/schemas/Coordinates'
                pickupInstructions:
                  type: string
                  maxLength: 1000
                destinationAddress:
                  type: string
                  minLength: 3
                  maxLength: 500
                destination:
                  $ref: '#/components/schemas/Coordinates'
                recipientName:
                  type: string
                  minLength: 1
                  maxLength: 160
                recipientPhone:
                  type: string
                  minLength: 7
                  maxLength: 32
                parcelCategory:
                  type: string
                  minLength: 1
                  maxLength: 80
                parcelDescription:
                  type: string
                  maxLength: 2000
                parcelSize:
                  type: string
                  minLength: 1
                  maxLength: 80
                declaredValueMinor:
                  $ref: '#/components/schemas/MinorAmount'
                handlingInstructions:
                  type: string
                  maxLength: 1000
      responses:
        '201':
          description: Draft booking created; no payment has been initiated.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/ParcelBooking'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Idempotency conflict or requested zone/service is not available.
  /driver/offers/{offerId}/propose-fare:
    post:
      tags: [Driver offers]
      operationId: proposeDriverFare
      summary: Submit or revise a driver fare proposal
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - name: offerId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposedFareMinor, currency]
              properties:
                proposedFareMinor:
                  $ref: '#/components/schemas/MinorAmount'
                currency:
                  type: string
                  const: NGN
      responses:
        '200':
          description: Fare proposal recorded with a server-generated expiry.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/FareOffer'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          description: Caller is not the assigned driver for this offer.
        '409':
          description: Offer is no longer eligible for a fare proposal.
  /parcel-bookings/{bookingId}/accept-fare:
    post:
      tags: [Parcel bookings]
      operationId: acceptParcelFare
      summary: Accept one valid driver fare proposal
      description: |
        Acceptance is transactional. The backend snapshots driver fare, fixed
        connection fee and other disclosed charges, reserves the selected driver
        while payment is pending, and withdraws competing offers. This endpoint
        does not initialize payment.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerId]
              properties:
                offerId:
                  type: string
      responses:
        '200':
          description: Fare accepted; booking is awaiting payment.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/AcceptedQuote'
        '403':
          description: Caller does not own this booking.
        '409':
          description: Offer expired, quote already accepted, or driver reservation conflict.
  /payments:
    post:
      tags: [Payments]
      operationId: initializePayment
      summary: Initialize payment for an accepted quote
      description: |
        Planned and disabled until the project owner approves payment implementation.
        The request intentionally contains no amount, fee, split destination or
        provider reference; all are computed and verified server-side.
      x-implementation-status: planned-disabled
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingType, bookingId]
              properties:
                bookingType:
                  type: string
                  enum: [PARCEL, RIDE]
                bookingId:
                  type: string
      responses:
        '202':
          description: Payment attempt initialized with provider checkout details.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/PaymentInitialization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: No accepted quote, payment already in progress, or booking is not payable.
        '503':
          description: Payment processing is disabled or provider is unavailable.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [name, status, version, paymentsEnabled]
          properties:
            name:
              type: string
              const: Logistic Hub API
            status:
              type: string
              const: ok
            version:
              type: string
            paymentsEnabled:
              type: boolean
              const: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor currency units serialized as a decimal string.
      examples: ['430000']
    Coordinates:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    GeocodeResult:
      type: object
      required: [formattedAddress, location]
      properties:
        formattedAddress:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
    RouteResult:
      type: object
      required: [distanceMeters, durationSeconds]
      properties:
        distanceMeters:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        encodedPolyline:
          type: string
    ParcelBooking:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          const: DRAFT
        paymentStatus:
          type: string
          const: INITIALIZED
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    FareOffer:
      type: object
      required: [id, status, proposedFareMinor, currency, expiresAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        proposedFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
    AcceptedQuote:
      type: object
      required: [bookingId, offerId, status, driverFareMinor, connectionFeeMinor, otherChargesMinor, customerPayableMinor, currency, expiresAt]
      properties:
        bookingId:
          type: string
        offerId:
          type: string
        status:
          type: string
          const: AWAITING_PAYMENT
        driverFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
    PaymentInitialization:
      type: object
      required: [id, status, amountMinor, currency]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        authorizationUrl:
          type: string
          format: uri
          description: Provider-hosted checkout URL; omitted if not available.
