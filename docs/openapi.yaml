        - in: query
          name: status
          schema: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, DEAD] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Client-scoped delivery telemetry and pagination.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, eventId, endpointId, eventType, sequence, status, attempts, totalAttempts, replayCount, nextAttemptAt, lastHttpStatus, lastErrorCode]
                          properties:
                            id: { type: string }
                            eventId: { type: string }
