      summary: Register a webhook endpoint and issue its first signing secret
      description: |
        Requires webhooks:manage. HTTPS on port 443 only. URL credentials, query strings,
        fragments, IP literals and hostnames resolving to any non-public address are rejected.
        The signing secret is returned once and is never returned by list or update operations.
