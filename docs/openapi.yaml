            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [name, status, version, paymentsEnabled]
          properties:
            name:
              type: string
              const: Logistic Hub API
            status:
              type: string
              const: ok
            version:
              type: string
            paymentsEnabled:
              type: boolean
              const: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor units serialized as a decimal string.
      examples: ['430000']
    PositiveMinorAmount:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive integer minor units serialized as a decimal string.
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    GeocodeResult:
      type: object
      required: [formattedAddress, location]
      properties:
        formattedAddress:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
    RouteResult:
      type: object
      required: [distanceMeters, durationSeconds]
      properties:
        distanceMeters:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        encodedPolyline:
          type: string
    ParcelBookingCreated:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          const: DRAFT
        paymentStatus:
          type: string
          const: INITIALIZED
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    ParcelBookingResource:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt, updatedAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
        paymentStatus:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        pickupAddress:
          type: string
        pickupInstructions:
          type: string
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destinationAddress:
          type: string
        destination:
          $ref: '#/components/schemas/Coordinates'
        recipientName:
          type: string
        recipientPhone:
          type: string
        parcelCategory:
          type: string
        parcelDescription:
          type: string
        parcelSize:
          type: string
        declaredValueMinor:
          $ref: '#/components/schemas/MinorAmount'
        handlingInstructions:
          type: string
        driverFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FareOffer:
      type: object
      required: [id, status, proposedFareMinor, currency, expiresAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        proposedFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
        driver:
          $ref: '#/components/schemas/DriverSummary'
    DriverSummary:
      type: object
      required: [displayName, verificationStatus, completedJobs]
      properties:
        displayName:
          type: string
          description: Public display name; do not expose the driver's full legal name by default.
        verificationStatus:
          type: string
          const: VERIFIED
        rating:
          type: number
          minimum: 0
          maximum: 5
        completedJobs:
          type: integer
          minimum: 0
        vehicleType:
          type: string
          enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK]
    DriverOfferResource:
      type: object
      required: [id, status, expiresAt, serviceType, pickup, destination]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        expiresAt:
          type: string
          format: date-time
        serviceType:
          type: string
          const: PARCEL_DELIVERY
        pickup:
