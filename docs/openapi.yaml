      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, name, reason]
              properties:
                code: { type: string, minLength: 2, maxLength: 64, pattern: '^[a-z0-9][a-z0-9_-]*$' }
                name: { type: string, minLength: 2, maxLength: 120 }
                reason: { type: string, minLength: 5, maxLength: 500 }
                scopes:
                  type: array
                  maxItems: 30
                  items: { type: string, minLength: 3, maxLength: 80 }
                metadata: { type: object, additionalProperties: true }
      responses:
        '201': { description: Client registered. No service credential is created automatically. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Client code already exists. }
  /admin/integrations/{clientId}/scopes:
    patch:
      tags: [Admin]
      operationId: updateIntegrationClientScopes
      summary: Update an integration client's API scopes
      description: ADMIN-only. Scope changes are recorded in the operational audit log.
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scopes, reason]
              properties:
                scopes:
                  type: array
                  maxItems: 30
                  uniqueItems: true
                  items: { type: string, minLength: 3, maxLength: 80 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200':
          description: Updated integration client scope set.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [client, replay]
                    properties:
                      client: { type: object, additionalProperties: true }
                      replay: { type: boolean }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/integrations/{clientId}/status:
    patch:
      tags: [Admin]
      operationId: updateIntegrationClientStatus
      summary: Suspend, reactivate or permanently revoke an integration client
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Client status updated. Revoked clients are terminal. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Integration client not found. }
        '409': { description: Invalid client lifecycle transition. }
  /admin/integrations/{clientId}/credentials:
    post:
      tags: [Admin]
      operationId: issueIntegrationCredential
      summary: Issue a one-time integration service secret
      description: The raw secret is returned only in this response. Logistic Hub persists only its SHA-256 hash.
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label, reason]
              properties:
                label: { type: string, minLength: 2, maxLength: 80 }
                expiresAt: { type: string, format: date-time }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: Credential metadata and one-time raw secret. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Integration client not found. }
        '409': { description: Credentials cannot be issued to an inactive client. }
  /admin/integrations/credentials/{credentialId}/revoke:
    post:
      tags: [Admin]
      operationId: revokeIntegrationCredential
      summary: Revoke an integration credential
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Credential revoked; repeated revocation is idempotent. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Integration credential not found. }
  /admin/integrations/{clientId}/billing-agreements:
    post:
      tags: [Admin]
      operationId: createIntegrationBillingAgreement
      summary: Create a draft versioned billing agreement
      description: Creating an agreement does not activate collection, wallet debits, payouts or settlement.
      x-implementation-status: implemented
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: clientId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reference, billingModel, reason]
              properties:
                reference: { type: string, minLength: 2, maxLength: 80 }
                billingModel: { type: string, enum: [PLATFORM_COLLECTED, LOGISTIC_HUB_COLLECTED, PREPAID_ACCOUNT, INVOICE] }
                effectiveFrom: { type: string, format: date-time }
                effectiveUntil: { type: string, format: date-time }
                terms: { type: object, additionalProperties: true }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '201': { description: Draft agreement created with the next version number. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Integration client not found. }
        '409': { description: Integration client is inactive. }


  /integrations/quotes:
    post:
      tags: [Integrations]
      operationId: createIntegrationQuoteSession
      summary: Create a multi-package quote session with multiple contracted delivery options
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [billingAgreementReference, externalReference, pickupServiceZoneId, destinationServiceZoneId, pickupAddress, pickup, destinationAddress, destination, recipientName, recipientPhone, packages]
              properties:
                billingAgreementReference: { type: string, minLength: 2, maxLength: 80 }
                externalReference: { type: string, minLength: 1, maxLength: 128 }
                pickupServiceZoneId: { type: string }
                destinationServiceZoneId: { type: string }
                pickupAddress: { type: string, minLength: 3, maxLength: 500 }
                destinationAddress: { type: string, minLength: 3, maxLength: 500 }
                pickup:
                  type: object
                  required: [latitude, longitude]
                  properties:
                    latitude: { type: number, minimum: -90, maximum: 90 }
                    longitude: { type: number, minimum: -180, maximum: 180 }
                destination:
                  type: object
                  required: [latitude, longitude]
                  properties:
                    latitude: { type: number, minimum: -90, maximum: 90 }
                    longitude: { type: number, minimum: -180, maximum: 180 }
                recipientName: { type: string, minLength: 1, maxLength: 160 }
                recipientPhone: { type: string, minLength: 7, maxLength: 32 }
                expiresInMinutes: { type: integer, minimum: 5, maximum: 1440, default: 60 }
                packages:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    additionalProperties: false
                    required: [packageCategory]
                    properties:
                      externalPackageRef: { type: string, minLength: 1, maxLength: 100 }
                      packageCategory: { type: string, minLength: 2, maxLength: 80 }
                      description: { type: string, maxLength: 500 }
                      weightGrams: { type: integer, minimum: 1 }
                      lengthMm: { type: integer, minimum: 1 }
                      widthMm: { type: integer, minimum: 1 }
                      heightMm: { type: integer, minimum: 1 }
                      declaredValueMinor: { type: string, pattern: '^(0|[1-9][0-9]{0,14})$' }
      responses:
        '201': { description: Quote session and available delivery options. Local-direct or hub-assisted routes without fixed local-driver pricing return REQUIRES_OPERATIONAL_PRICING and no selectable options. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration scope is missing. }
        '409': { $ref: '#/components/responses/Conflict' }
  /integrations/quotes/{quoteSessionId}:
    get:
      tags: [Integrations]
      operationId: getIntegrationQuoteSession
      summary: Retrieve a quote session belonging to the authenticated integration client
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: quoteSessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quote session, package assessment and options.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [id, externalReference, status, billingAgreementReference, billingModel, billingAgreementVersion, currency, expiresAt, assessment, selectedOptionId, packages, options, createdAt]
                    properties:
                      id: { type: string }
                      externalReference: { type: string }
                      status: { type: string, enum: [QUOTED, SELECTED, BOOKED, EXPIRED, REQUIRES_MEASUREMENT, REQUIRES_OPERATIONAL_PRICING, NO_COVERAGE] }
                      billingAgreementReference: { type: [string, 'null'] }
                      billingModel: { type: [string, 'null'] }
                      billingAgreementVersion: { type: integer }
                      currency: { type: string, minLength: 3, maxLength: 3 }
                      expiresAt: { type: string, format: date-time }
                      assessment:
                        type: object
                        additionalProperties: true
                      selectedOptionId: { type: [string, 'null'] }
                      packages:
                        type: array
                        items:
                          type: object
                          required: [id, packageCategory, assessmentStatus, assessmentSource]
                          properties:
                            id: { type: string }
                            packageSequence: { type: integer, minimum: 0 }
                            externalPackageRef: { type: [string, 'null'] }
                            packageCategory: { type: string }
                            weightGrams: { type: [integer, 'null'] }
                            lengthMm: { type: [integer, 'null'] }
                            widthMm: { type: [integer, 'null'] }
                            heightMm: { type: [integer, 'null'] }
                            assessmentStatus: { type: string, enum: [DECLARED, ESTIMATED, MEASURED, REQUIRES_MEASUREMENT] }
                            assessmentSource: { type: string }
                      options:
                        type: array
                        items:
                          type: object
                          required: [id, optionCode, status, currency, logisticsCostMinor, platformChargeMinor, otherChargesMinor, customerChargeMinor, estimatedTransitMinutes, routeMode, route, expiresAt]
                          properties:
                            id: { type: string }
                            optionCode: { type: string }
                            status: { type: string, enum: [AVAILABLE, SELECTED, REJECTED, EXPIRED] }
                            currency: { type: string, minLength: 3, maxLength: 3 }
                            logisticsCostMinor: { $ref: '#/components/schemas/MinorAmount' }
                            platformChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                            otherChargesMinor: { $ref: '#/components/schemas/MinorAmount' }
                            customerChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                            estimatedTransitMinutes: { type: [integer, 'null'] }
                            routeMode: { type: string }
                            route: { type: object, additionalProperties: true }
                            expiresAt: { type: string, format: date-time }
                      createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration scope is missing. }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations/quotes/{quoteSessionId}/options/{optionId}/accept:
    post:
      tags: [Integrations]
      operationId: acceptIntegrationQuoteOption
      summary: Select one quote option for a quote session
      description: This records the accepted option only. It does not create a parcel booking or initiate payment.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: quoteSessionId
          required: true
          schema: { type: string }
        - in: path
          name: optionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Option selected. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration scope is missing. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /integrations/shipments:
    post:
      tags: [Integrations]
      operationId: createIntegrationShipment
      summary: Create an integration-owned shipment from a selected quote and external payment attestation
      description: |
        The external fulfilment reference must match the quote session. The integration attests that it verified customer payment; Logistic Hub checks the delivery charge and currency against the selected option but does not independently verify or collect that payment. This operation creates no Logistic Hub PaymentAttempt, Paystack transaction, payment-ledger entry or refund.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quoteSessionId, quoteOptionId, externalFulfillmentReference, paymentAttestation]
              properties:
                quoteSessionId: { type: string, minLength: 1, maxLength: 128 }
                quoteOptionId: { type: string, minLength: 1, maxLength: 128 }
                externalFulfillmentReference: { type: string, minLength: 1, maxLength: 128 }
                paymentAttestation:
                  type: object
                  additionalProperties: false
                  required: [paymentProvider, externalPaymentReference, verifiedAt, currency, deliveryChargeMinor]
                  properties:
                    paymentProvider: { type: string, minLength: 2, maxLength: 40, pattern: '^[A-Za-z0-9._-]{2,40}' }
                    externalPaymentReference: { type: string, minLength: 1, maxLength: 128 }
                    verifiedAt: { type: string, format: date-time }
                    currency: { type: string, pattern: '^[A-Z]{3}' }
                    deliveryChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                    orderPaymentAmountMinor: { $ref: '#/components/schemas/MinorAmount' }
      responses:
        '201':
          description: Integration-owned shipment, accepted quote, delivery plan and payment-attestation record created atomically.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [shipment, paymentAttestation, replay]
                    properties:
                      replay: { type: boolean }
                      shipment:
                        type: object
                        required: [id, reference, externalFulfillmentReference, status, paymentStatus, currency, customerChargeMinor, routeMode, deliveryLegs, packages]
                        properties:
                          id: { type: string }
                          reference: { type: string }
                          externalFulfillmentReference: { type: string }
                          status: { type: string, const: AWAITING_PARTNER_ASSIGNMENT }
                          paymentStatus: { type: string, const: SUCCEEDED }
                          currency: { type: string }
                          customerChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                          routeMode: { type: string, const: END_TO_END }
                          deliveryLegs: { type: array, items: { type: object, additionalProperties: true } }
                          packages: { type: array, items: { type: object, additionalProperties: true } }
                      paymentAttestation:
                        type: object
                        additionalProperties: true
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:write. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /integrations/shipments/by-external-reference/{externalFulfillmentReference}:
    get:
      tags: [Integrations]
      operationId: getIntegrationShipmentByExternalReference
      summary: Recover a shipment by the integrating platform's fulfilment reference
      description: |
        Requires the shipments:read scope. Both the external-reference mapping and underlying booking are constrained to the authenticated integration client. Unknown and other-client references return the same not-found response.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: externalFulfillmentReference
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Shipment state and safe commercial/operational summary.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [shipment]
                    properties:
                      shipment:
                        $ref: '#/components/schemas/IntegrationShipmentResource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:read. }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations/shipments/by-external-reference/{externalFulfillmentReference}/packing-evidence:
    post:
      tags: [Integrations]
      operationId: uploadIntegrationPackingEvidence
      summary: Upload one private packing evidence image for an integration shipment
      description: Requires shipments:write. Accepts one JPEG, PNG or WebP binary image up to 5 MiB. Repeated slot uploads create immutable versions; reuse an Idempotency-Key only for the same payload.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
            pattern: "^[A-Za-z0-9._:-]+$"
        - in: header
          name: X-Evidence-Slot
          required: true
          schema:
            type: string
            enum: [CONTENTS_OVERVIEW, PRODUCT_DETAILS, QUANTITY_CHECK, SEALED_PARCEL]
        - in: header
          name: X-Evidence-Actor-Reference
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: header
          name: X-File-Content-Type
          required: true
          schema:
            type: string
            enum: [image/jpeg, image/png, image/webp]
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string, minLength: 1, maxLength: 160 }
        - in: path
          name: externalFulfillmentReference
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201':
          description: Private evidence stored and versioned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/IntegrationPackingEvidence' }
        '200':
          description: Idempotent replay of an existing evidence upload.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data: { $ref: '#/components/schemas/IntegrationPackingEvidence' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:write. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Idempotency key conflict or evidence persistence conflict. }
        '413': { description: Image exceeds 5 MiB. }
        '415': { description: Unsupported media type or invalid image signature. }
        '503': { description: Private evidence storage is unavailable. }
    get:
      tags: [Integrations]
      operationId: listIntegrationPackingEvidence
      summary: List the latest packing evidence version for each slot
      description: Requires shipments:read. The shipment and evidence are scoped to the authenticated integration client. Earlier versions are retained but not returned by this current-evidence listing.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: externalFulfillmentReference
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Current evidence metadata; no storage URLs are returned.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [shipmentReference, evidence]
                    properties:
                      shipmentReference: { type: string }
                      evidence:
                        type: array
                        maxItems: 4
                        items: { $ref: '#/components/schemas/IntegrationPackingEvidence' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:read. }
        '404': { $ref: '#/components/responses/NotFound' }
  /integrations/shipments/by-external-reference/{externalFulfillmentReference}/packing-evidence/{evidenceId}/download:
    get:
      tags: [Integrations]
      operationId: downloadIntegrationPackingEvidence
      summary: Download private packing evidence for its owning shipment
      description: Requires shipments:read. Both evidence ID and external fulfilment reference are checked against the authenticated client and the same shipment.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: externalFulfillmentReference
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: path
          name: evidenceId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Original image bytes with private, no-store response headers.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:read. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Stored evidence failed checksum verification. }
  /integrations/webhooks:
    get:
      tags: [Webhooks]
      operationId: listIntegrationWebhookEndpoints
      summary: List webhook endpoints owned by the authenticated integration client
      description: Requires the webhooks:manage scope. Secret material is never returned.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200':
          description: Client-scoped endpoint metadata.
          content:
            application/json:
