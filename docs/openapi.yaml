          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 1000 } } }
      responses:
        '200': { description: Cancellation applied or routed for review. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Booking state prevents cancellation. }
  /support/parcel-bookings/{bookingId}/cancel:
    post:
      tags: [Support]
      operationId: requestParcelCancellation
      summary: Cancel an eligible unpaid parcel or request post-payment review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 5, maxLength: 1000 } } }
      responses:
        '200': { description: Cancellation applied or routed for review. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Booking state prevents cancellation. }
  /admin/partner-rate-cards/{rateCardId}/publish:
    post:
      tags: [Admin]
      operationId: publishPartnerRateCard
      summary: Publish an eligible draft partner rate card
      description: Requires an active, verified transport partner, an active agreement, current effective dates, and at least one active rate. Replaces the agreement's previously active rate card; accepted quote snapshots remain unchanged.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: rateCardId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Rate card published and previous active version retired.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Rate card or its partner agreement is not eligible for publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/parcel-bookings/{bookingId}/quotes:
    post:
      tags: [Admin]
      operationId: createShipmentQuote
      summary: Issue a versioned quote for a parcel booking
      description: Contracted partner rates are preferred. A manual transport charge requires an explicit reason and administrator authorization. Payment remains disabled.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                partnerRateId: { type: string, minLength: 1, maxLength: 128 }
                transportChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                collectionChargeMinor: { $ref: '#/components/schemas/MinorAmount', default: '0' }
                hubHandlingChargeMinor: { $ref: '#/components/schemas/MinorAmount', default: '0' }
                destinationDeliveryChargeMinor: { $ref: '#/components/schemas/MinorAmount', default: '0' }
                platformChargeMinor: { $ref: '#/components/schemas/MinorAmount', default: '0' }
                otherChargesMinor: { $ref: '#/components/schemas/MinorAmount', default: '0' }
                expiresInMinutes: { type: integer, minimum: 5, maximum: 10080, default: 1440 }
                reason: { type: string, maxLength: 500 }
      responses:
        '201': { description: Quote created with immutable input and charge snapshots. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Booking is terminal or selected partner rate is not currently eligible. }
  /parcel-bookings/{bookingId}/quotes:
    get:
      tags: [Parcel bookings]
      operationId: listShipmentQuotes
      summary: List quotes for an owned parcel booking
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Quotes ordered newest version first. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /parcel-bookings/{bookingId}/quotes/{quoteId}/accept:
    post:
      tags: [Parcel bookings]
      operationId: acceptShipmentQuote
      summary: Accept one unexpired quote for an owned booking
      description: Acceptance is transactional, snapshots the total, supersedes competing offers and moves the booking to awaiting payment. Payment itself remains disabled.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: path
          name: quoteId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Accepted quote and persisted booking price snapshot. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Quote expired, already decided, or no longer available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /parcel-bookings/{bookingId}/quotes/{quoteId}/reject:
    post:
      tags: [Parcel bookings]
      operationId: rejectShipmentQuote
      summary: Reject an unexpired quote for an owned booking
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: path
          name: quoteId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Quote rejected. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Quote is no longer available. }
  /payments:
    post:
      tags: [Payments]
      operationId: initializePayment
      summary: Initialize payment for an accepted parcel quote
      description: |
        Planned and disabled until the owner approves implementation. The request
        contains no amount, fee, split destination or provider reference. The server
        computes all amounts and uses a versioned split-routing configuration.
      x-implementation-status: planned-disabled
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookingType, bookingId]
              properties:
                bookingType:
                  type: string
                  const: PARCEL
                bookingId:
                  type: string
                  minLength: 1
      responses:
        '202':
          description: Payment attempt initialized with provider checkout details.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/PaymentInitialization'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: No accepted quote, payment already in progress, or booking is not payable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Payment processing is disabled or provider is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [name, status, version, paymentsEnabled]
          properties:
            name:
              type: string
              const: Logistic Hub API
            status:
              type: string
              const: ok
            version:
              type: string
            paymentsEnabled:
              type: boolean
              const: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor units serialized as a decimal string.
      examples: ['430000']
    PositiveMinorAmount:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive integer minor units serialized as a decimal string.
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    GeocodeResult:
      type: object
      required: [formattedAddress, location]
      properties:
        formattedAddress:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
    RouteResult:
      type: object
      required: [distanceMeters, durationSeconds]
      properties:
        distanceMeters:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        encodedPolyline:
          type: string
    ParcelBookingCreated:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          const: DRAFT
        paymentStatus:
          type: string
          const: INITIALIZED
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    ParcelBookingResource:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt, updatedAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
        paymentStatus:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        pickupAddress:
          type: string
        pickupInstructions:
          type: string
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destinationAddress:
          type: string
        destination:
          $ref: '#/components/schemas/Coordinates'
        recipientName:
          type: string
        recipientPhone:
          type: string
        parcelCategory:
          type: string
        parcelDescription:
          type: string
        parcelSize:
          type: string
        declaredValueMinor:
          $ref: '#/components/schemas/MinorAmount'
        handlingInstructions:
          type: string
        driverFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FareOffer:
      type: object
      required: [id, status, proposedFareMinor, currency, expiresAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        proposedFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
        driver:
          $ref: '#/components/schemas/DriverSummary'
    DriverSummary:
      type: object
      required: [displayName, verificationStatus, completedJobs]
      properties:
        displayName:
          type: string
          description: Public display name; do not expose the driver's full legal name by default.
        verificationStatus:
          type: string
          const: VERIFIED
        rating:
          type: number
          minimum: 0
          maximum: 5
        completedJobs:
          type: integer
          minimum: 0
        vehicleType:
          type: string
          enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK]
    DriverOfferResource:
      type: object
      required: [id, status, expiresAt, serviceType, pickup, destination]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        expiresAt:
          type: string
          format: date-time
        serviceType:
          type: string
          const: PARCEL_DELIVERY
        pickup:
          $ref: '#/components/schemas/LocationSummary'
        destination:
          $ref: '#/components/schemas/LocationSummary'
        parcelCategory:
          type: string
        parcelSize:
          type: string
        parcelDescription:
          type: string
          description: Omit or redact sensitive contents where not needed for driver eligibility.
        handlingInstructions:
          type: string
    LocationSummary:
      type: object
      required: [address, coordinates]
      properties:
        address:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
    AcceptedQuote:
      type: object
      required: [bookingId, offerId, status, driverFareMinor, connectionFeeMinor, otherChargesMinor, customerPayableMinor, currency, expiresAt]
      properties:
        bookingId:
          type: string
        offerId:
          type: string
        status:
          type: string
          const: AWAITING_PAYMENT
        driverFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
      description: Quote reservation expiry while the customer completes payment; it is distinct from the original driver offer expiry.
    PaymentInitialization:
      type: object
      required: [id, status, amountMinor, currency]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        authorizationUrl:
          type: string
          format: uri
          description: Provider-hosted checkout URL; omitted if not available.
    PaymentStatusResource:
      type: object
      required: [id, status, amountMinor, currency, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        updatedAt:
          type: string
          format: date-time

