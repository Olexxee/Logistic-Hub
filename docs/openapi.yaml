        The client cannot set status, payment status, price snapshots or driver assignment.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - pickupServiceZoneId
                - destinationServiceZoneId
                - pickupAddress
                - pickup
                - destinationAddress
                - destination
                - recipientName
                - recipientPhone
                - parcelCategory
                - parcelSize
              properties:
                pickupServiceZoneId:
                  type: string
