            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Success:
      description: The request completed successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [name, status, version, paymentsEnabled]
          properties:
            name:
              type: string
              const: Logistic Hub API
            status:
              type: string
              const: ok
            version:
              type: string
            paymentsEnabled:
              type: boolean
              const: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor units serialized as a decimal string.
      examples: ['430000']
    PositiveMinorAmount:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive integer minor units serialized as a decimal string.
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    GeocodeResult:
      type: object
      required: [formattedAddress, location]
      properties:
        formattedAddress:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
    RouteResult:
      type: object
      required: [distanceMeters, durationSeconds]
      properties:
        distanceMeters:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        encodedPolyline:
          type: string
    ParcelBookingCreated:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          const: DRAFT
        paymentStatus:
          type: string
          const: INITIALIZED
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    ParcelBookingResource:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt, updatedAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
        paymentStatus:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        pickupAddress:
          type: string
        pickupInstructions:
          type: string
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destinationAddress:
          type: string
        destination:
          $ref: '#/components/schemas/Coordinates'
        recipientName:
          type: string
        recipientPhone:
          type: string
        parcelCategory:
          type: string
        parcelDescription:
          type: string
        parcelSize:
          type: string
        declaredValueMinor:
          $ref: '#/components/schemas/MinorAmount'
        handlingInstructions:
          type: string
        driverFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryLegResource:
      type: object
      required: [id, sequence, type, status, origin, destination, assignment]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [DIRECT, LOCAL_PICKUP, HUB_TRANSFER, INTERSTATE_TRANSPORT, FINAL_MILE]
        status:
          type: string
          enum: [PLANNED, READY_FOR_ASSIGNMENT, AWAITING_PAYMENT, ASSIGNED, PICKUP_VERIFICATION_PENDING, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, FAILED, CANCELLED]
        origin:
          $ref: '#/components/schemas/ServiceZoneSummary'
        destination:
          $ref: '#/components/schemas/ServiceZoneSummary'
        originHub:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        destinationHub:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        plannedAt: { type: string, format: date-time, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        pickedUpAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
        assignment:
          oneOf:
            - $ref: '#/components/schemas/DeliveryLegAssignmentSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DeliveryLegAssignmentSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [AWAITING_PAYMENT, ACCEPTED, ARRIVED_AT_PICKUP, PICKUP_CONFIRMED, IN_PROGRESS, ARRIVED_AT_DESTINATION, COMPLETED, CANCELLED, FAILED]
        acceptedAt: { type: string, format: date-time, nullable: true }
        pickupAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    FareOffer:
      type: object
      required: [id, status, proposedFareMinor, currency, expiresAt, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
        proposedFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        driver:
          $ref: '#/components/schemas/DriverSummary'
    DriverSummary:
      type: object
      required: [displayName, completedJobs]
      properties:
        displayName:
          type: string
          description: Public display name; do not expose the driver's full legal name by default.
        averageRating:
          type: string
          nullable: true
        completedJobs:
          type: integer
          minimum: 0
        vehicleType:
          type: string
          enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK]
    HubOpeningHours:
      type: object
      additionalProperties: false
      required: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY]
      properties:
        MONDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        TUESDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        WEDNESDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        THURSDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        FRIDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        SATURDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
        SUNDAY: { $ref: '#/components/schemas/HubOpeningSlots' }
    HubOpeningSlots:
      type: array
      maxItems: 3
      items:
        type: object
        additionalProperties: false
        required: [opensAt, closesAt]
        properties:
          opensAt:
            type: string
            pattern: "^[0-9]{2}:[0-9]{2}$"
          closesAt:
            type: string
            pattern: "^[0-9]{2}:[0-9]{2}$"
    HubCapacityConfig:
      type: object
      additionalProperties: false
      required: [maxParcels]
      properties:
        maxParcels: { type: integer, minimum: 1, maximum: 100000 }
        maxWeightGrams: { type: integer, minimum: 1, maximum: 100000000 }
        maxVolumeCm3: { type: integer, minimum: 1, maximum: 1000000000 }
    FareProposalResult:
      type: object
      required: [offerId, proposedFareMinor, currency, status]
      properties:
        offerId: { type: string }
        proposedFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency: { type: string, const: NGN }
        status: { type: string, const: OFFERED }
        replay: { type: boolean }
    DriverOfferResource:
      type: object
      required: [id, currency, expiresAt, createdAt, booking]
      properties:
        id:
          type: string
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        booking:
          type: object
          required: [id, publicReference, currency, parcelCategory, parcelSize, pickupServiceZone, destinationServiceZone]
          properties:
            id: { type: string }
            publicReference: { type: string }
            currency: { type: string, const: NGN }
            parcelCategory: { type: string }
            parcelSize: { type: string }
            pickupServiceZone:
              $ref: '#/components/schemas/ServiceZoneSummary'
            destinationServiceZone:
              $ref: '#/components/schemas/ServiceZoneSummary'
      description: Driver-facing offer intentionally omits exact pickup/destination addresses, coordinates, and recipient contact details until assignment.
    ServiceZoneSummary:
      type: object
      required: [name]
      properties:
        name: { type: string }
    LocationSummary:
      type: object
      required: [address, coordinates]
      properties:
        address:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
    AcceptedQuote:
      type: object
      required: [bookingId, status, assignmentId, deliveryLegId, driverFareMinor, connectionFeeMinor, otherChargesMinor, customerPayableMinor, currency, paymentExpiresAt]
      properties:
        bookingId: { type: string }
        status:
          type: string
          const: AWAITING_PAYMENT
        assignmentId: { type: string }
        deliveryLegId: { type: string }
        driverFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency: { type: string, const: NGN }
        paymentExpiresAt:
          type: string
          format: date-time
        replay: { type: boolean }
      description: Driver reservation expiry while the customer completes payment; it is distinct from the original driver offer expiry.
    PaymentInitialization:
      type: object
      required: [id, status, amountMinor, currency]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        authorizationUrl:
          type: string
          format: uri
          description: Provider-hosted checkout URL; omitted if not available.
    PaymentStatusResource:
      type: object
      required: [id, status, amountMinor, currency, updatedAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        updatedAt:
          type: string
          format: date-time
 }
      responses:
        '200': { description: Refresh token revoked. }
        '400': { $ref: '#/components/responses/ValidationError' }
  /auth/sessions/revoke-all:
    post:
      tags: [Authentication]
      operationId: revokeAllRefreshTokens
      summary: Revoke all refresh tokens for the authenticated account
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: All refresh tokens revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /cancellations:
    post:
      tags: [Cancellations]
      operationId: requestBookingCancellation
      summary: Cancel an eligible booking or submit a post-payment cancellation request
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [bookingType, bookingId, reason]
              properties:
                bookingType: { type: string, enum: [PARCEL, RIDE] }
                bookingId: { type: string, minLength: 1, maxLength: 128 }
                reason: { type: string, minLength: 5, maxLength: 500 }
      responses:
        '200': { description: Cancellation applied or routed for review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /finance/refund-requests:
    post:
      tags: [Finance]
      operationId: requestFinanceRefund
      summary: Request a refund for an eligible payment attempt
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        '201': { description: Refund request recorded for review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /finance/admin/refunds:
    get:
      tags: [Finance]
      operationId: listFinanceRefunds
      summary: List refund requests for admin and support review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: Refund requests. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/admin/refunds/{refundId}:
    patch:
      tags: [Finance]
      operationId: reviewFinanceRefund
      summary: Approve or reject a refund request
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundReview'
      responses:
        '200': { description: Refund review recorded. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/admin/payouts:
    get:
      tags: [Finance]
      operationId: listFinancePayouts
      summary: List payout requests for admin and support review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: Payout requests. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /finance/admin/payouts/{payoutId}/confirm-settlement:
    patch:
      tags: [Finance]
      operationId: confirmFinancePayoutSettlement
      summary: Record confirmation of an off-platform payout settlement
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - name: payoutId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [providerReference]
              properties:
                providerReference: { type: string, minLength: 3, maxLength: 128 }
      responses:
        '200': { description: Settlement confirmation recorded. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /finance/admin/reconciliation:
    get:
      tags: [Finance]
      operationId: listFinanceReconciliation
      summary: List financial reconciliation exceptions
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: Reconciliation records. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Success:
      description: The request completed successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    RateLimited:
