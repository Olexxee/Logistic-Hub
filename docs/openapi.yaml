components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: The request conflicts with the current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Success:
      description: The request completed successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    PartnerMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PartnerMembershipResource' }
    PartnerMembershipResource:
      type: object
      required: [id, role, isActive, partner]
      properties:
        id: { type: string }
        role: { type: string, enum: [OWNER, OPERATIONS, DISPATCHER] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        partner:
          type: object
          required: [id, displayName, status, verificationStatus]
          properties:
            id: { type: string }
            displayName: { type: string }
            status: { type: string }
            verificationStatus: { type: string }
    HubMembershipList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HubMembershipResource' }
    HubMembershipResource:
      type: object
      required: [id, role, isActive, hubPoint]
      properties:
        id: { type: string }
        role: { type: string, enum: [MANAGER, OPERATOR] }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        hubPoint:
          type: object
          required: [id, name, status, address, serviceZoneId]
          properties:
            id: { type: string }
            name: { type: string }
            status: { type: string }
            address: { type: string }
            serviceZoneId: { type: string }
    AdminUserSearchResult:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUserResource' }
        pagination: { $ref: '#/components/schemas/PageMetadata' }
    AdminUserResource:
      type: object
      required: [id, fullName, role, status, createdAt]
      properties:
        id: { type: string }
        fullName: { type: string }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        role: { type: string, enum: [CUSTOMER, DRIVER, ADMIN, SUPPORT, PARTNER_OPERATOR, HUB_OPERATOR] }
        status: { type: string, enum: [PENDING, ACTIVE, SUSPENDED, CLOSED] }
        emailVerifiedAt: { type: [string, 'null'], format: date-time }
        phoneVerifiedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    AdminQuoteSearchResult:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminQuoteResource' }
        pagination: { $ref: '#/components/schemas/PageMetadata' }
    AdminQuoteResource:
      type: object
      required: [id, version, status, currency, transportChargeMinor, totalCustomerChargeMinor, expiresAt, offeredAt, booking]
      properties:
        id: { type: string }
        version: { type: integer }
        status: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, EXPIRED, SUPERSEDED] }
        currency: { type: string }
        transportChargeMinor: { type: string, pattern: '^[0-9]+$' }
        collectionChargeMinor: { type: string, pattern: '^[0-9]+$' }
        hubHandlingChargeMinor: { type: string, pattern: '^[0-9]+$' }
        destinationDeliveryChargeMinor: { type: string, pattern: '^[0-9]+$' }
        platformChargeMinor: { type: string, pattern: '^[0-9]+$' }
        otherChargesMinor: { type: string, pattern: '^[0-9]+$' }
        totalCustomerChargeMinor: { type: string, pattern: '^[0-9]+$' }
        expiresAt: { type: string, format: date-time }
        offeredAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        booking:
          type: object
          required: [id, publicReference, status, paymentStatus, pickupServiceZone, destinationServiceZone]
          properties:
            id: { type: string }
            publicReference: { type: string }
            status: { type: string }
            paymentStatus: { type: string }
            pickupServiceZone:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            destinationServiceZone:
              type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
        partner:
          oneOf:
            - type: object
              required: [id, displayName]
              properties:
                id: { type: string }
                displayName: { type: string }
            - type: 'null'
    DriverAssignmentSearchResult:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DriverAssignmentResource' }
        pagination:
          type: object
          required: [page, limit, hasMore, nextPage]
          properties:
            page: { type: integer }
            limit: { type: integer }
            hasMore: { type: boolean }
            nextPage: { type: [integer, 'null'] }
    PageMetadata:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    DriverAssignmentResource:
      type: object
      required: [id, status, agreedFareMinor, currency, booking]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACCEPTED, ARRIVED_AT_PICKUP, PICKUP_CONFIRMED, IN_PROGRESS, ARRIVED_AT_DESTINATION] }
        agreedFareMinor: { type: string, pattern: '^[0-9]+$' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        acceptedAt: { type: [string, 'null'], format: date-time }
        pickupAt: { type: [string, 'null'], format: date-time }
        startedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        booking:
          type: object
          required: [id, publicReference, status, bookingType, pickupAddress, destinationAddress]
          properties:
            id: { type: string }
            publicReference: { type: string }
            status: { type: string }
            bookingType: { type: string, enum: [PARCEL, RIDE] }
            pickupAddress: { type: string }
            destinationAddress: { type: string }
            recipientName: { type: [string, 'null'] }
            recipientPhone: { type: [string, 'null'] }
        deliveryLeg:
          oneOf:
            - type: object
              required: [id, sequence, type, status]
              properties:
                id: { type: string }
                sequence: { type: integer }
                type: { type: string }
                status: { type: string }
            - type: 'null'
    RefundRequest:
      type: object
      additionalProperties: false
      required: [paymentAttemptId, amountMinor, reason]
      properties:
        paymentAttemptId: { type: string, minLength: 1, maxLength: 128 }
        amountMinor: { $ref: '#/components/schemas/PositiveMinorAmount' }
        reason: { type: string, minLength: 10, maxLength: 1000 }
    RefundReview:
      type: object
      additionalProperties: false
      required: [decision, reviewNote]
      properties:
