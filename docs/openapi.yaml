                            updatedAt: { type: string, format: date-time }
                      pagination:
                        type: object
                        required: [page, limit, total, totalPages]
                        properties:
                          page: { type: integer }
                          limit: { type: integer }
                          total: { type: integer }
                          totalPages: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks webhooks:read. }
  /integrations/webhooks/{endpointId}/replay:
    post:
      tags: [Webhooks]
      operationId: replayIntegrationWebhookDeliveries
      summary: Requeue existing webhook deliveries for replay
      description: |
        Requires webhooks:manage. Supply either eventId or shipmentId with an inclusive
        fromSequence/toSequence range. Replays only existing SUCCEEDED or DEAD deliveries
        for an active endpoint and current event subscriptions. Sequence ranges and delivery
        count are limited to 100; each endpoint is limited to 10 replay requests per minute.
        Replay does not create shipment events or change shipment event sequence numbers.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: endpointId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [eventId]
                  properties:
                    eventId: { type: string, minLength: 1, maxLength: 128 }
                - type: object
                  additionalProperties: false
                  required: [shipmentId, fromSequence, toSequence]
                  properties:
                    shipmentId: { type: string, minLength: 1, maxLength: 128 }
                    fromSequence: { type: integer, minimum: 1 }
                    toSequence: { type: integer, minimum: 1 }
      responses:
        '202':
          description: Existing delivery rows requeued for asynchronous delivery.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [endpointId, requeuedCount, deliveryIds, scheduledAt]
                    properties:
                      endpointId: { type: string }
                      requeuedCount: { type: integer }
                      deliveryIds:
                        type: array
                        items: { type: string }
                      scheduledAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks webhooks:manage. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { description: Endpoint replay rate limit exceeded. }
