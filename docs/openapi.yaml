openapi: 3.1.0
info:
  title: Logistic Hub API
  version: 1.0.0
  description: |
    Versioned backend contract for Logistic Hub. Planned endpoints are specifications,
    not proof of implementation. Monetary amounts are decimal strings representing
    integer minor units (kobo for NGN).
servers:
  - url: /api/v1
    description: Configure the host for each environment.
tags:
  - name: Health
  - name: Geography
  - name: Maps
  - name: Authentication
  - name: Parcel bookings
  - name: Driver offers
  - name: Delivery legs
  - name: Partner execution
  - name: Partner settlement
  - name: Payments
  - name: Drivers
  - name: Admin
  - name: Hub points
  - name: Notifications
  - name: Webhooks
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process health
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Process health only; database readiness is reported separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database readiness
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: PostgreSQL readiness confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [service, status, dependencies, timestamp]
                    properties:
                      service: { const: logistic-hub-api }
                      status: { const: ready }
                      dependencies:
                        type: object
                        required: [database]
                        properties:
                          database: { const: ok }
                      timestamp: { type: string, format: date-time }
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /service-zones:
    get:
      tags: [Geography]
      operationId: listActiveServiceZones
      summary: List active service zones and service availability
      x-implementation-status: implemented
      parameters:
        - in: query
          name: countryCode
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            default: NG
        - in: query
          name: stateCode
          description: ISO 3166-2 subdivision code, such as NG-LA.
          schema:
            type: string
            pattern: '^NG-[A-Z]{2}$'
        - in: query
          name: lgaCode
          schema:
            type: string
        - in: query
          name: serviceType
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: Active zones only; reference geography without active service is excluded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceZone'
        '400':
          $ref: '#/components/responses/ValidationError'
  /maps/geocode:
    post:
      tags: [Maps]
      operationId: geocodeAddress
      summary: Convert an address to candidate coordinates
      description: Geocoding does not establish service-zone eligibility.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Normalized geocoding result.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/GeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No candidate location was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /maps/routes:
    post:
      tags: [Maps]
      operationId: computeRoute
      summary: Estimate route distance and duration
      description: Route distance and duration are estimates, not fare guarantees.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin, destination]
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
                travelMode:
                  type: string
                  enum: [DRIVE, TWO_WHEELER, WALK, BICYCLE]
                  default: DRIVE
      responses:
        '200':
          description: Normalized route estimate.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RouteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerCustomer
      summary: Register a customer and send an email verification link
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName, email, password]
              properties:
                fullName: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '201':
          description: Account created; verification email accepted.
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email is already registered.
        '503':
          description: Email service is unavailable.
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address using a one-time token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Email verified and account activated.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a verified active account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: Short-lived bearer access token and public account profile.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is not active or email is not verified.
        '503':
          description: Authentication signing is not configured.
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Generic response that does not disclose whether the account exists.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password using a one-time reset token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Password reset successfully.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: Return the authenticated account profile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account profile.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /drivers/me:
    get:
      tags: [Drivers]
      operationId: getMyDriverProfile
      summary: Read the authenticated user's driver profile and onboarding status
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: "Driver profile, or null if onboarding has not started." }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /drivers/onboarding:
    post:
      tags: [Drivers]
      operationId: submitDriverOnboarding
      summary: Submit a driver profile and vehicle for review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle]
              properties:
                serviceRadiusMeters: { type: integer, minimum: 500, maximum: 100000, default: 5000 }
                vehicle:
                  type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type: { type: string, enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK] }
                    make: { type: string, maxLength: 80 }
                    model: { type: string, maxLength: 80 }
                    registrationPlate: { type: string, minLength: 2, maxLength: 32 }
                    parcelCapacity: { type: string, maxLength: 80 }
      responses:
        '201': { description: Onboarding submitted; driver and vehicle await admin review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Driver profile or vehicle already exists. }
  /drivers/availability:
    patch:
      tags: [Drivers]
      operationId: setDriverAvailability
      summary: Set online and available status for a verified driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isOnline, isAvailable]
              properties:
                isOnline: { type: boolean }
                isAvailable: { type: boolean }
      responses:
        '200': { description: Updated online and available state. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Driver is not ready for dispatch. }
  /drivers/location:
    post:
      tags: [Drivers]
      operationId: recordDriverLocation
      summary: Record a location update for a verified online driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [latitude, longitude]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                accuracyMeters: { type: number, minimum: 0, maximum: 10000 }
      responses:
        '201': { description: Location recorded; response includes timestamp. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-events:
    get:
      tags: [Admin]
      operationId: listAdminOperationalAuditEvents
      summary: Query operational audit history across modules
      description: ADMIN-only paginated audit feed for driver, hub, transport partner, agreement, and rate-card lifecycle events.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: entityType
          schema: { type: string, enum: [DRIVER_PROFILE, HUB_POINT, TRANSPORT_PARTNER, PARTNER_AGREEMENT, PARTNER_RATE_CARD] }
        - in: query
          name: entityId
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: action
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: actorUserId
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Paginated audit events with actor and before/after state. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/admin/{driverProfileId}/verification:
    patch:
      tags: [Admin]
      operationId: reviewDriverVerification
      summary: Approve or reject driver verification
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverProfileId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationStatus]
              properties:
                verificationStatus: { type: string, enum: [VERIFIED, REJECTED] }
      responses:
        '200': { description: Driver verification updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/vehicles/{vehicleId}/verification:
    patch:
      tags: [Admin]
      operationId: reviewVehicleVerification
      summary: Approve or reject a driver's vehicle
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: vehicleId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [verificationStatus]
              properties:
                verificationStatus: { type: string, enum: [VERIFIED, REJECTED] }
      responses:
        '200': { description: Vehicle verification updated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/coverage:
    put:
      tags: [Admin]
      operationId: setDriverCoverage
      summary: Enable or disable service-zone coverage for a driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [driverProfileId, serviceZoneId, serviceType, isEnabled]
              properties:
                driverProfileId: { type: string }
                serviceZoneId: { type: string }
                serviceType: { $ref: '#/components/schemas/ServiceType' }
                isEnabled: { type: boolean }
      responses:
        '200': { description: Driver coverage upserted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/drivers:
    get:
      tags: [Admin]
      operationId: listAdminDrivers
      summary: List driver onboarding and operational profiles
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: verificationStatus
          schema: { type: string, enum: [NOT_SUBMITTED, PENDING, VERIFIED, REJECTED, EXPIRED] }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: "Paginated driver profiles with account, vehicle and service coverage summaries." }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/admin/drivers/{driverProfileId}/status:
    patch:
      tags: [Admin]
      operationId: setAdminDriverOperationalStatus
      summary: Suspend or reinstate a driver
      description: Suspension immediately disables online and available state. Reinstatement does not automatically put the driver online.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverProfileId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, reason]
              properties:
                status: { type: string, enum: [SUSPENDED, ACTIVE] }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '200': { description: Driver operational status updated and audit event recorded. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Requested suspension or reinstatement is not a valid state transition. }
  /drivers/admin/drivers/{driverProfileId}/audit:
    get:
      tags: [Admin]
      operationId: listAdminDriverAuditEvents
      summary: List operational audit events for a driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: driverProfileId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Paginated driver audit history including actor and before/after state. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/vehicles:
    get:
      tags: [Admin]
      operationId: listAdminDriverVehicles
      summary: List driver vehicles for verification and operations review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: verificationStatus
          schema: { type: string, enum: [NOT_SUBMITTED, PENDING, VERIFIED, REJECTED, EXPIRED] }
        - in: query
          name: isActive
          schema: { type: boolean }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        '200': { description: Paginated vehicles with owning driver and account summaries. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /hub-points:
    get:
      tags: [Hub points]
      operationId: listActiveHubPoints
      summary: List active parcel drop-off and collection points
      description: Only active hub points in active zones with current parcel-service availability are returned.
      x-implementation-status: implemented
      security: []
      parameters:
        - in: query
          name: countryCode
          schema: { type: string, minLength: 2, maxLength: 2, default: NG }
        - in: query
          name: stateCode
          schema: { type: string, minLength: 5, maxLength: 5 }
        - in: query
          name: lgaName
          schema: { type: string, minLength: 1, maxLength: 100 }
        - in: query
          name: serviceZoneId
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string, minLength: 1, maxLength: 120 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Active hub points with zone, LGA, state and country labels.
        '400':
          $ref: '#/components/responses/ValidationError'
  /hub-points/admin:
    get:
      tags: [Admin]
      operationId: listAdminHubPoints
      summary: List hub points for operational administration
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: Hub points with their service-zone and geography details. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: createAdminHubPoint
      summary: Register a pending hub point
      description: Hub activation is blocked until operator contact, seven-day opening hours, accepted parcel types, capacity and active parcel service availability are configured.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [serviceZoneId, name, address, latitude, longitude]
              properties:
                serviceZoneId: { type: string }
                name: { type: string, minLength: 2, maxLength: 120 }
                address: { type: string, minLength: 5, maxLength: 500 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                operatorName: { type: [string, "null"], maxLength: 120 }
                operatorPhone: { type: [string, "null"], maxLength: 32 }
                openingHours:
                  $ref: '#/components/schemas/HubOpeningHours'
                acceptedParcelTypes:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items: { type: string, minLength: 1, maxLength: 60 }
                capacityConfig:
                  $ref: '#/components/schemas/HubCapacityConfig'
      responses:
        '201': { description: Hub registered in PENDING status. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /hub-points/admin/{hubPointId}:
    patch:
      tags: [Admin]
      operationId: updateAdminHubPoint
      summary: Update hub operational details
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: hubPointId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                address: { type: string, minLength: 5, maxLength: 500 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                operatorName: { type: [string, "null"], maxLength: 120 }
                operatorPhone: { type: [string, "null"], maxLength: 32 }
                openingHours: { $ref: '#/components/schemas/HubOpeningHours' }
                acceptedParcelTypes: { type: array, minItems: 1, maxItems: 30, items: { type: string, minLength: 1, maxLength: 60 } }
                capacityConfig: { $ref: '#/components/schemas/HubCapacityConfig' }
      responses:
        '200': { description: Hub operational details updated. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /hub-points/admin/{hubPointId}/status:
    patch:
      tags: [Admin]
      operationId: setAdminHubPointStatus
      summary: Activate, suspend or close a hub point
