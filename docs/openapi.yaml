  /parcel-bookings/{bookingId}/accept-fare:
    post:
      tags: [Parcel bookings]
      operationId: acceptParcelFare
      summary: Accept one valid driver fare proposal
      description: |
        Acceptance is transactional. The backend snapshots the agreed fare and
        fixed connection fee, reserves the selected driver while payment is pending,
        and withdraws competing offers. This does not initialize payment.
      x-implementation-status: planned
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [offerId]
              properties:
                offerId:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Fare accepted; booking awaits payment.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/AcceptedQuote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Offer expired, another offer was accepted, or booking is no longer payable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /payments:
    post:
      tags: [Payments]
      operationId: initializePayment
      summary: Initialize payment for an accepted parcel quote
      description: |
        Planned and disabled until the owner approves implementation. The request
        contains no amount, fee, split destination or provider reference. The server
