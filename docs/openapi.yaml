      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
