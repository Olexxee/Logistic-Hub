    FareProposalResult:
      type: object
      required: [offerId, proposedFareMinor, currency, status]
      properties:
        offerId: { type: string }
        proposedFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        currency: { type: string, const: NGN }
        status: { type: string, const: OFFERED }
        replay: { type: boolean }
    DriverOfferResource:
      type: object
      required: [id, currency, expiresAt, createdAt, booking]
      properties:
        id:
          type: string
        currency:
          type: string
          const: NGN
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        booking:
          type: object
          required: [id, publicReference, currency, parcelCategory, parcelSize, pickupServiceZone, destinationServiceZone]
          properties:
            id: { type: string }
            publicReference: { type: string }
            currency: { type: string, const: NGN }
            parcelCategory: { type: string }
            parcelSize: { type: string }
            pickupServiceZone:
              $ref: '#/components/schemas/ServiceZoneSummary'
            destinationServiceZone:
              $ref: '#/components/schemas/ServiceZoneSummary'
      description: Driver-facing offer intentionally omits exact pickup/destination addresses, coordinates, and recipient contact details until assignment.
    ServiceZoneSummary:
      type: object
      required: [name]
      properties:
        name: { type: string }
    LocationSummary:
      type: object
      required: [address, coordinates]
      properties:
        address:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
    AcceptedQuote:
      type: object
      required: [bookingId, status, assignmentId, deliveryLegId, driverFareMinor, connectionFeeMinor, otherChargesMinor, customerPayableMinor, currency, paymentExpiresAt]
      properties:
        bookingId: { type: string }
        status:
          type: string
          const: AWAITING_PAYMENT
        assignmentId: { type: string }
        deliveryLegId: { type: string }
        driverFareMinor:
          $ref: '#/components/schemas/PositiveMinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency: { type: string, const: NGN }
        paymentExpiresAt:
          type: string
          format: date-time
        replay: { type: boolean }
      description: Driver reservation expiry while the customer completes payment; it is distinct from the original driver offer expiry.
    PaymentInitialization:
      type: object
      required: [id, status, amountMinor, currency]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [INITIALIZED, PENDING]
        amountMinor:
          $ref: '#/components/schemas/MinorAmount'
        currency:
          type: string
          const: NGN
        authorizationUrl:
          type: string
          format: uri
          description: Provider-hosted checkout URL; omitted if not available.
    PaymentStatusResource:
      type: object
      required: [id, provider, status, amountMinor, currency, initializedAt]
      properties:
        id: { type: string }
        provider: { type: string, enum: [PAYSTACK] }
        status: { type: string, enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED] }
        amountMinor: { $ref: '#/components/schemas/MinorAmount' }
        currency: { type: string, minLength: 3, maxLength: 3 }
        initializedAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        failedAt: { type: [string, 'null'], format: date-time }
        booking:
          oneOf:
            - type: object
              required: [id, publicReference, bookingType, status, paymentStatus]
              properties:
                id: { type: string }
                publicReference: { type: string }
                bookingType: { type: string, enum: [PARCEL, RIDE] }
                status: { type: string }
                paymentStatus: { type: string }
            - type: 'null'
