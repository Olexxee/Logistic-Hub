            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [shipment]
                    properties:
                      shipment:
                        $ref: '#/components/schemas/IntegrationShipmentResource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:read. }
        '404': { $ref: '#/components/responses/NotFound' }
