        id: { type: string }
        countryId: { type: string }
        code: { type: string }
        name: { type: string }
        isActive: { type: boolean }
        country:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
            isActive: { type: boolean }
        _count:
          type: object
          properties:
            lgas: { type: integer, minimum: 0 }
