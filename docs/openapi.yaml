              required: [bookingType, bookingId]
              properties:
                bookingType:
                  type: string
                  const: PARCEL
                bookingId:
                  type: string
                  minLength: 1
      responses:
        '202':
          description: Payment attempt initialized with provider checkout details.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
