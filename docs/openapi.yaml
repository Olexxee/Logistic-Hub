    LgaResource:
      type: object
      required: [id, stateId, name]
      properties:
        id: { type: string }
        stateId: { type: string }
        code: { type: [string, 'null'] }
        name: { type: string }
        state:
          type: object
          properties:
            id: { type: string }
            code: { type: string }
            name: { type: string }
        _count:
          type: object
          properties:
            zones: { type: integer, minimum: 0 }
    ServiceAvailabilityResource:
      type: object
      required: [id, serviceZoneId, serviceType, isEnabled]
      properties:
        id: { type: string }
        serviceZoneId: { type: string }
        serviceType: { type: string, enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS] }
        isEnabled: { type: boolean }
        startsAt: { type: [string, 'null'], format: date-time }
        endsAt: { type: [string, 'null'], format: date-time }
        config: { type: [object, 'null'], additionalProperties: true }
    ServiceZoneResource:
      type: object
      required: [id, stateId, code, name, isActive]
      properties:
        id: { type: string }
        stateId: { type: string }
        lgaId: { type: [string, 'null'] }
        code: { type: string }
        name: { type: string }
        boundaryGeoJson: { type: [object, 'null'], additionalProperties: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ServiceZoneAdminResource:
      allOf:
        - $ref: '#/components/schemas/ServiceZoneResource'
        - type: object
          properties:
            state:
              type: object
              properties:
                id: { type: string }
                code: { type: string }
                name: { type: string }
                country: { type: object }
            lga:
              oneOf:
                - $ref: '#/components/schemas/LgaResource'
                - type: 'null'
            availability:
              type: array
              items: { $ref: '#/components/schemas/ServiceAvailabilityResource' }
    ReadinessErrorResponse:
      type: object
      required: [success, data, error]
      properties:
        success: { const: false }
        data:
          type: object
          required: [service, status, dependencies, timestamp]
          properties:
            service: { type: string, const: logistic-hub-api }
            status: { type: string, const: not_ready }
            dependencies:
              type: object
              required: [database]
              properties:
                database:
                  type: object
                  required: [status]
                  properties:
                    status: { type: string, const: unavailable }
            timestamp: { type: string, format: date-time }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, const: DEPENDENCY_UNAVAILABLE }
            message: { type: string }
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success: { const: true }
        data:
          type: object
          required: [service, status, uptimeSeconds, timestamp, environment, paymentsEnabled]
          properties:
            service: { type: string, const: logistic-hub-api }
            status: { type: string, const: ok }
            uptimeSeconds: { type: integer, minimum: 0 }
            timestamp: { type: string, format: date-time }
            environment: { type: string }
            paymentsEnabled: { type: boolean, const: false }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor units serialized as a decimal string.
      examples: ['430000']
    ShipmentQuoteResource:
      type: object
      required: [id, parcelBookingId, version, status, partnerAgreementId, partnerRateId, currency, transportChargeMinor, collectionChargeMinor, hubHandlingChargeMinor, destinationDeliveryChargeMinor, platformChargeMinor, otherChargesMinor, totalCustomerChargeMinor, chargeBreakdown, expiresAt, offeredAt, acceptedAt]
      properties:
        id: { type: string }
        parcelBookingId: { type: string }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [OFFERED, ACCEPTED, REJECTED, EXPIRED, SUPERSEDED] }
        partnerAgreementId: { type: [string, 'null'] }
        partnerRateId: { type: [string, 'null'] }
        currency: { type: string, minLength: 3, maxLength: 3 }
        transportChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        collectionChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        hubHandlingChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        destinationDeliveryChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        platformChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        otherChargesMinor: { $ref: '#/components/schemas/MinorAmount' }
        totalCustomerChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
        chargeBreakdown:
          type: object
          additionalProperties: true
          description: Immutable itemized charge snapshot; all monetary values are decimal strings in minor units.
        expiresAt: { type: string, format: date-time }
        offeredAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
    ShipmentQuoteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ShipmentQuoteResource' }
    ShipmentRoutePlan:
      type: object
      required: [routeMode, legs]
      properties:
        routeMode: { type: string, enum: [LOCAL_DIRECT, HUB_ASSISTED, END_TO_END] }
        originHub:
          oneOf:
            - type: object
              required: [id, name]
              properties: { id: { type: string }, name: { type: string } }
            - type: 'null'
        destinationHub:
          oneOf:
            - type: object
              required: [id, name]
              properties: { id: { type: string }, name: { type: string } }
            - type: 'null'
        legs:
          type: array
          items:
            type: object
            required: [id, sequence, type, status, originServiceZoneId, destinationServiceZoneId, originHubPointId, destinationHubPointId]
            properties:
              id: { type: string }
              sequence: { type: integer, minimum: 1 }
              type: { type: string, enum: [DIRECT, LOCAL_PICKUP, HUB_TRANSFER, INTERSTATE_TRANSPORT, FINAL_MILE] }
              status: { type: string, enum: [PLANNED, READY_FOR_ASSIGNMENT, AWAITING_PAYMENT, ASSIGNED, PICKUP_VERIFICATION_PENDING, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, FAILED, CANCELLED] }
              originServiceZoneId: { type: string }
              destinationServiceZoneId: { type: string }
              originHubPointId: { type: [string, 'null'] }
              destinationHubPointId: { type: [string, 'null'] }
    ShipmentQuoteAcceptance:
      type: object
      required: [quote, routePlan, replay]
      properties:
        quote: { $ref: '#/components/schemas/ShipmentQuoteResource' }
        routePlan:
          oneOf:
            - $ref: '#/components/schemas/ShipmentRoutePlan'
            - type: 'null'
        replay: { type: boolean }
    PositiveMinorAmount:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive integer minor units serialized as a decimal string.
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    PlacesAutocompleteResult:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          maxItems: 5
          items:
            type: object
            required: [placeId, text, types]
            properties:
              placeId: { type: string }
              text: { type: string }
              mainText: { type: string }
              secondaryText: { type: string }
              types:
                type: array
                items: { type: string }
    PlaceDetailsResult:
      type: object
      required: [placeId, formattedAddress, location, countryCode, addressComponents]
      properties:
        placeId: { type: string }
        formattedAddress: { type: string }
        location:
          $ref: '#/components/schemas/Coordinates'
        countryCode: { type: string, const: NG }
        addressComponents:
          type: array
          items:
            type: object
            required: [longText, shortText, types]
            properties:
              longText: { type: string }
              shortText: { type: string }
              types:
                type: array
                items: { type: string }
    GeocodeResult:
      type: object
      required: [formattedAddress, location]
      properties:
        formattedAddress:
          type: string
        location:
          $ref: '#/components/schemas/Coordinates'
        placeId:
          type: string
    RouteResult:
      type: object
      required: [distanceMeters, durationSeconds]
      properties:
        distanceMeters:
          type: integer
          minimum: 0
        durationSeconds:
          type: integer
          minimum: 0
        encodedPolyline:
          type: string
    ParcelBookingCreated:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          const: DRAFT
        paymentStatus:
          type: string
          const: INITIALIZED
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    ParcelBookingResource:
      type: object
      required: [id, publicReference, status, paymentStatus, currency, pickupServiceZoneId, destinationServiceZoneId, createdAt, updatedAt]
      properties:
        id:
          type: string
        publicReference:
          type: string
        status:
          type: string
          enum: [DRAFT, MATCHING, AWAITING_CUSTOMER_ACCEPTANCE, AWAITING_PAYMENT, PAYMENT_PENDING, AWAITING_PARTNER_ASSIGNMENT, DRIVER_ASSIGNED, PICKUP_VERIFICATION_PENDING, PICKED_UP, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, CANCELLATION_PENDING, CANCELLED, FAILED]
        paymentStatus:
          type: string
          enum: [INITIALIZED, PENDING, SUCCEEDED, FAILED, ABANDONED, REVERSED]
        currency:
          type: string
          const: NGN
        pickupServiceZoneId:
          type: string
        destinationServiceZoneId:
          type: string
        pickupAddress:
          type: string
        pickupInstructions:
          type: string
        pickup:
          $ref: '#/components/schemas/Coordinates'
        destinationAddress:
          type: string
        destination:
          $ref: '#/components/schemas/Coordinates'
        recipientName:
          type: string
        recipientPhone:
          type: string
        parcelCategory:
          type: string
        parcelDescription:
          type: string
        parcelSize:
          type: string
        declaredValueMinor:
          $ref: '#/components/schemas/MinorAmount'
        handlingInstructions:
          type: string
        driverFareMinor:
          $ref: '#/components/schemas/MinorAmount'
        connectionFeeMinor:
          $ref: '#/components/schemas/MinorAmount'
        otherChargesMinor:
          $ref: '#/components/schemas/MinorAmount'
        customerPayableMinor:
          $ref: '#/components/schemas/MinorAmount'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    IntegrationPackingEvidence:
      type: object
      additionalProperties: false
      required: [id, slot, version, actorReference, originalName, mimeType, sizeBytes, sha256, uploadedAt]
      properties:
        id: { type: string }
        slot:
          type: string
          enum: [CONTENTS_OVERVIEW, PRODUCT_DETAILS, QUANTITY_CHECK, SEALED_PARCEL]
        version: { type: integer, minimum: 1 }
        actorReference: { type: string }
        originalName: { type: string }
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes: { type: string, pattern: "^[1-9][0-9]*$" }
        sha256: { type: string, pattern: "^[a-f0-9]{64}$" }
        uploadedAt: { type: string, format: date-time }
    IntegrationWebhookEndpoint:
      type: object
      additionalProperties: false
      required: [id, url, eventTypes, status, secretVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        description: { type: [string, 'null'] }
        eventTypes:
          type: array
          items: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, REVOKED] }
        secretVersion: { type: integer, minimum: 1 }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntegrationShipmentResource:
      type: object
      required: [id, reference, externalFulfillmentReference, status, paymentStatus, currency, customerChargeMinor, packages, deliveryLegs, paymentAttestation]
      properties:
        id: { type: string }
        reference: { type: string }
        externalFulfillmentReference: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        currency: { type: string }
        customerChargeMinor:
          oneOf:
            - $ref: '#/components/schemas/MinorAmount'
            - type: 'null'
        routeMode: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        packages:
          type: array
          items:
            type: object
            required: [sequence, category, dimensionsMm]
            properties:
              sequence: { type: integer, minimum: 0 }
              externalPackageReference: { type: [string, 'null'] }
              category: { type: string }
              description: { type: [string, 'null'] }
              weightGrams: { type: [integer, 'null'] }
              dimensionsMm:
                type: object
                required: [length, width, height]
                properties:
                  length: { type: [integer, 'null'] }
                  width: { type: [integer, 'null'] }
                  height: { type: [integer, 'null'] }
              assessmentStatus: { type: string }
              assessmentSource: { type: string }
              assessedAt: { type: string, format: date-time }
        deliveryLegs:
          type: array
          items:
            type: object
            required: [id, sequence, type, status]
            properties:
              id: { type: string }
              sequence: { type: integer, minimum: 1 }
              type: { type: string }
              status: { type: string }
              origin: { type: [object, 'null'], additionalProperties: true }
              destination: { type: [object, 'null'], additionalProperties: true }
              plannedAt: { type: [string, 'null'], format: date-time }
              assignedAt: { type: [string, 'null'], format: date-time }
              pickedUpAt: { type: [string, 'null'], format: date-time }
              startedAt: { type: [string, 'null'], format: date-time }
              completedAt: { type: [string, 'null'], format: date-time }
              failureReason: { type: [string, 'null'] }
        acceptedQuote:
          oneOf:
            - type: object
              required: [version, status, currency, customerChargeMinor]
              properties:
                version: { type: integer }
                status: { type: string, const: ACCEPTED }
                currency: { type: string }
                customerChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
                acceptedAt: { type: [string, 'null'], format: date-time }
            - type: 'null'
        paymentAttestation:
          type: object
          required: [status]
          properties:
            status: { type: string, enum: [ATTESTED, NOT_RECORDED] }
            provider: { type: string }
            verifiedAt: { type: string, format: date-time }
            attestedAt: { type: string, format: date-time }
            deliveryChargeMinor: { $ref: '#/components/schemas/MinorAmount' }
            currency: { type: string }
      description: |
        Client-scoped shipment view. Intentionally excludes internal partner/logistics costs,
        package declared values, recipient contact details and full pickup/destination addresses.
    DeliveryLegResource:
      type: object
      required: [id, sequence, type, status, origin, destination, assignment]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        type:
          type: string
          enum: [DIRECT, LOCAL_PICKUP, HUB_TRANSFER, INTERSTATE_TRANSPORT, FINAL_MILE]
        status:
          type: string
          enum: [PLANNED, READY_FOR_ASSIGNMENT, AWAITING_PAYMENT, ASSIGNED, PICKUP_VERIFICATION_PENDING, IN_TRANSIT, DELIVERY_VERIFICATION_PENDING, COMPLETED, FAILED, CANCELLED]
        origin:
          $ref: '#/components/schemas/ServiceZoneSummary'
        destination:
          $ref: '#/components/schemas/ServiceZoneSummary'
        originHub:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        destinationHub:
          oneOf:
            - type: object
              required: [id, name]
              properties:
                id: { type: string }
                name: { type: string }
            - type: 'null'
        plannedAt: { type: string, format: date-time, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        pickedUpAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
        assignment:
          oneOf:
            - $ref: '#/components/schemas/DeliveryLegAssignmentSummary'
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PartnerAssignmentServiceZone:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state:
          type: object
          required: [code, name]
          properties:
            code: { type: string }
            name: { type: string }
    PartnerAssignmentHub:
      type: object
      required: [id, name, address]
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
    AssignmentLocation:
      type: object
      required: [serviceZone, hub, address, latitude, longitude]
      properties:
        serviceZone:
          $ref: '#/components/schemas/ServiceZoneSummary'
        hub:
          oneOf:
            - type: object
              required: [id, name, address]
              properties:
                id: { type: string }
                name: { type: string }
                address: { type: string }
            - type: 'null'
        address: { type: string }
        latitude: { type: string }
        longitude: { type: string }
    DeliveryLegAssignmentSummary:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status:
          type: string
          enum: [AWAITING_PAYMENT, ACCEPTED, ARRIVED_AT_PICKUP, PICKUP_CONFIRMED, IN_PROGRESS, ARRIVED_AT_DESTINATION, COMPLETED, CANCELLED, FAILED]
        acceptedAt: { type: string, format: date-time, nullable: true }
        pickupAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
    FareOffer:
      type: object
      required: [id, status, proposedFareMinor, currency, expiresAt, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [OFFERED, ACCEPTED, DECLINED, EXPIRED, WITHDRAWN]
