components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique client-generated key for one logical state-changing request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Caller is authenticated but not allowed to access this resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist or is not visible to the caller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [success, data]
      properties:
        success:
          const: true
        data:
          type: object
          required: [name, status, version, paymentsEnabled]
          properties:
            name:
              type: string
              const: Logistic Hub API
            status:
              type: string
              const: ok
            version:
              type: string
            paymentsEnabled:
              type: boolean
              const: false
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          const: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: array
                    items:
                      oneOf:
                        - type: string
                        - type: integer
                  message:
                    type: string
    MinorAmount:
      type: string
      pattern: '^[0-9]+$'
      description: Non-negative integer minor units serialized as a decimal string.
      examples: ['430000']
    PositiveMinorAmount:
      type: string
      pattern: '^[1-9][0-9]*$'
      description: Positive integer minor units serialized as a decimal string.
    Coordinates:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceType:
      type: string
      enum: [PARCEL_DELIVERY, PASSENGER_RIDE, HUB_POINT, BUSINESS_LOGISTICS]
    ServiceZone:
      type: object
      required: [id, code, name, countryCode, stateCode, stateName, isActive, services]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        countryCode:
          type: string
          const: NG
        stateCode:
          type: string
          examples: [NG-LA]
        stateName:
          type: string
        lgaCode:
          type: string
        lgaName:
          type: string
        isActive:
          type: boolean
          const: true
        services:
          type: array
          items:
            type: object
            required: [serviceType, isEnabled]
            properties:
              serviceType:
                $ref: '#/components/schemas/ServiceType'
              isEnabled:
                type: boolean
    GeocodeResult:
