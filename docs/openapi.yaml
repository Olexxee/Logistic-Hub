      tags: [Integrations]
      operationId: listIntegrationShipmentEvents
      summary: List sanitized shipment tracking events after a per-shipment sequence
      description: |
        Requires shipments:read. The shipment and event history are scoped to the authenticated integration client. Unknown and other-client shipment IDs return the same not-found response. Events are returned in ascending sequence order; consumers should deduplicate by event ID and persist the nextAfterSequence cursor.
      x-implementation-status: implemented
      parameters:
        - in: header
          name: X-Integration-Key-Id
          required: true
          schema: { type: string }
        - in: header
          name: X-Integration-Secret
          required: true
          schema: { type: string }
        - in: path
          name: shipmentId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - in: query
          name: afterSequence
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Ordered, sanitized tracking events and pagination cursor.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [events, hasMore, nextAfterSequence]
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                          required: [id, sequence, eventType, schemaVersion, occurredAt, payload]
                          properties:
                            id: { type: string }
                            sequence: { type: integer, minimum: 1 }
                            eventType:
                              type: string
                              enum: [shipment.created, shipment.partner_assigned, shipment.in_transit, shipment.custody_handover_confirmed, shipment.delivery_leg_completed]
                            schemaVersion: { type: integer, const: 1 }
                            occurredAt: { type: string, format: date-time }
                            payload:
                              type: object
                              required: [shipmentReference, status]
                              properties:
                                shipmentReference: { type: string }
                                status: { type: string }
                      hasMore: { type: boolean }
                      nextAfterSequence: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Integration client lacks shipments:read. }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /integrations/shipments/{shipmentId}:
