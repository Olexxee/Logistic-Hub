                actualAmountMinor: { type: string, minLength: 1, maxLength: 18 }
                externalReference: { type: string, minLength: 3, maxLength: 200 }
                evidence:
                  type: array
                  maxItems: 10
                  items:
                    type: object
                    additionalProperties: false
                    required: [uri]
