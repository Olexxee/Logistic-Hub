openapi: 3.1.0
info:
  title: Logistic Hub API
  version: 1.0.0
  description: |
    Versioned backend contract for Logistic Hub. Planned endpoints are specifications,
    not proof of implementation. Monetary amounts are decimal strings representing
    integer minor units (kobo for NGN).
servers:
  - url: /api/v1
    description: Configure the host for each environment.
tags:
  - name: Health
  - name: Geography
  - name: Maps
  - name: Authentication
  - name: Parcel bookings
  - name: Driver offers
  - name: Delivery legs
  - name: Partner execution
  - name: Partner settlement
  - name: Payments
  - name: Drivers
  - name: Admin
  - name: Hub points
  - name: Notifications
  - name: Webhooks
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check process health
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Process health only; database readiness is reported separately.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Check database readiness
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: PostgreSQL readiness confirmed.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [service, status, dependencies, timestamp]
                    properties:
                      service: { const: logistic-hub-api }
                      status: { const: ready }
                      dependencies:
                        type: object
                        required: [database]
                        properties:
                          database:
                            type: object
                            required: [status, latencyMs]
                            properties:
                              status: { type: string, const: ok }
                              latencyMs: { type: integer, minimum: 0 }
                      timestamp: { type: string, format: date-time }
        '503':
          description: PostgreSQL is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessErrorResponse'
  /service-zones:
    get:
      tags: [Geography]
      operationId: listActiveServiceZones
      summary: List active service zones and service availability
      x-implementation-status: implemented
      parameters:
        - in: query
          name: countryCode
          schema:
            type: string
            pattern: '^[A-Z]{2}$'
            default: NG
        - in: query
          name: stateCode
          description: ISO 3166-2 subdivision code, such as NG-LA.
          schema:
            type: string
            pattern: '^NG-[A-Z]{2}$'
        - in: query
          name: lgaCode
          schema:
            type: string
        - in: query
          name: serviceType
          schema:
            $ref: '#/components/schemas/ServiceType'
      responses:
        '200':
          description: Active zones only; reference geography without active service is excluded.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceZone'
        '400':
          $ref: '#/components/responses/ValidationError'
  /maps/autocomplete:
    post:
      tags: [Maps]
      operationId: autocompleteNigerianLocations
      summary: Find Nigerian address and place suggestions
      description: Uses Places Autocomplete (New). Suggestions are transient provider results and do not establish operational serviceability.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [input]
              properties:
                input: { type: string, minLength: 2, maxLength: 200 }
                sessionToken: { type: string, minLength: 1, maxLength: 36, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        '200':
          description: Up to five normalized place predictions.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/PlacesAutocompleteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /maps/place-details:
    post:
      tags: [Maps]
      operationId: getNigerianPlaceDetails
      summary: Resolve a selected place prediction
      description: Returns normalized coordinates and address components only when the selected place is in Nigeria. Provider content must be used and retained in accordance with Google Maps Platform policies.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [placeId]
              properties:
                placeId: { type: string, minLength: 1, maxLength: 256 }
                sessionToken: { type: string, minLength: 1, maxLength: 36, pattern: "^[A-Za-z0-9_-]+$" }
      responses:
        '200':
          description: Selected Nigerian place details.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    $ref: '#/components/schemas/PlaceDetailsResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Place was not found or is outside Nigeria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /maps/geocode:
    post:
      tags: [Maps]
      operationId: geocodeAddress
      summary: Convert an address to candidate coordinates
      description: Geocoding does not establish service-zone eligibility.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [address]
              properties:
                address:
                  type: string
                  minLength: 3
                  maxLength: 500
      responses:
        '200':
          description: Normalized geocoding result.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/GeocodeResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No candidate location was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /maps/routes:
    post:
      tags: [Maps]
      operationId: computeRoute
      summary: Estimate route distance and duration
      description: Route distance and duration are estimates, not fare guarantees.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [origin, destination]
              properties:
                origin:
                  $ref: '#/components/schemas/Coordinates'
                destination:
                  $ref: '#/components/schemas/Coordinates'
                travelMode:
                  type: string
                  enum: [DRIVE, TWO_WHEELER, WALK, BICYCLE]
                  default: DRIVE
      responses:
        '200':
          description: Normalized route estimate.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    const: true
                  data:
                    $ref: '#/components/schemas/RouteResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Maps provider is disabled or unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/register:
    post:
      tags: [Authentication]
      operationId: registerCustomer
      summary: Register a customer and queue an email verification link
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [fullName, email, password]
              properties:
                fullName: { type: string, minLength: 2, maxLength: 160 }
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '201':
          description: Account created and verification email durably queued for background delivery.
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Email is already registered.
  /auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address using a one-time token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
      responses:
        '200':
          description: Email verified and account activated.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/verify-email/resend:
    post:
      tags: [Authentication]
      operationId: resendVerificationEmail
      summary: Queue a fresh verification email for an unverified account
      description: Returns the same generic response for unknown, active, and pending accounts to avoid disclosing account existence. Requests are rate limited.
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Generic response; a message is queued only when an unverified account exists.
        '400':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a verified active account
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200':
          description: 'Short-lived bearer access token and public account profile. Refresh token is set in an HttpOnly cookie and is not returned in JSON. Browser requests require an allowlisted Origin and X-Auth-CSRF: 1.'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Account is not active or email is not verified.
        '503':
          description: Authentication signing is not configured.
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password reset email
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Generic response that does not disclose whether the account exists.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Set a new password using a one-time reset token
      x-implementation-status: implemented
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 64, maxLength: 64 }
                password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        '200':
          description: Password reset successfully.
        '400':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAccount
      summary: Return the authenticated account profile
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current account profile.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /assignments/mine:
    get:
      tags: [Drivers]
      operationId: listMyParcelAssignments
      summary: List paid parcel assignments belonging to the authenticated driver
      description: Returns only parcel assignments owned by the authenticated driver profile and whose booking payment is verified as succeeded. Exact pickup, destination, recipient and handling details are disclosed only after assignment and payment.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Driver-owned paid parcel assignments and pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { const: true }
                  data:
                    type: object
                    required: [items, pagination]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, status, agreedFareMinor, currency, booking, deliveryLeg]
                          properties:
                            id: { type: string }
                            status: { type: string, enum: [AWAITING_PAYMENT, ACCEPTED, ARRIVED_AT_PICKUP, PICKUP_CONFIRMED, IN_PROGRESS, ARRIVED_AT_DESTINATION, COMPLETED, CANCELLED, FAILED] }
                            agreedFareMinor: { $ref: '#/components/schemas/MinorAmount' }
                            currency: { type: string, minLength: 3, maxLength: 3 }
                            acceptedAt: { type: [string, 'null'], format: date-time }
                            pickupAt: { type: [string, 'null'], format: date-time }
                            startedAt: { type: [string, 'null'], format: date-time }
                            completedAt: { type: [string, 'null'], format: date-time }
                            failureReason: { type: [string, 'null'] }
                            createdAt: { type: string, format: date-time }
                            updatedAt: { type: string, format: date-time }
                            booking:
                              type: object
                              required: [id, publicReference, status, paymentStatus, pickupAddress, destinationAddress, recipientName, recipientPhone, parcelCategory, parcelSize]
                              properties:
                                id: { type: string }
                                publicReference: { type: string }
                                status: { type: string }
                                paymentStatus: { type: string, const: SUCCEEDED }
                                pickupAddress: { type: string }
                                pickupInstructions: { type: [string, 'null'] }
                                destinationAddress: { type: string }
                                recipientName: { type: string }
                                recipientPhone: { type: string }
                                parcelCategory: { type: string }
                                parcelDescription: { type: [string, 'null'] }
                                parcelSize: { type: string }
                                handlingInstructions: { type: [string, 'null'] }
                            deliveryLeg:
                              oneOf:
                                - type: object
                                  required: [id, sequence, type, status, origin, destination]
                                  properties:
                                    id: { type: string }
                                    sequence: { type: integer, minimum: 1 }
                                    type: { type: string }
                                    status: { type: string }
                                    origin: { $ref: '#/components/schemas/AssignmentLocation' }
                                    destination: { $ref: '#/components/schemas/AssignmentLocation' }
                                - type: 'null'
                      pagination:
                        type: object
                        required: [page, limit, total, totalPages]
                        properties:
                          page: { type: integer, minimum: 1 }
                          limit: { type: integer, minimum: 1, maximum: 100 }
                          total: { type: integer, minimum: 0 }
                          totalPages: { type: integer, minimum: 0 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /drivers/me:
    get:
      tags: [Drivers]
      operationId: getMyDriverProfile
      summary: Read the authenticated user's driver profile and onboarding status
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: "Driver profile, or null if onboarding has not started." }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /drivers/onboarding:
    post:
      tags: [Drivers]
      operationId: submitDriverOnboarding
      summary: Submit a driver profile and vehicle for review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [vehicle]
              properties:
                serviceRadiusMeters: { type: integer, minimum: 500, maximum: 100000, default: 5000 }
                vehicle:
                  type: object
                  additionalProperties: false
                  required: [type]
                  properties:
                    type: { type: string, enum: [BICYCLE, MOTORCYCLE, CAR, VAN, PICKUP, TRUCK] }
                    make: { type: string, maxLength: 80 }
                    model: { type: string, maxLength: 80 }
                    registrationPlate: { type: string, minLength: 2, maxLength: 32 }
                    parcelCapacity: { type: string, maxLength: 80 }
      responses:
        '201': { description: Onboarding submitted; driver and vehicle await admin review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: Driver profile or vehicle already exists. }
  /drivers/me/reapply:
    post:
      tags: [Drivers]
      operationId: reapplyDriverVerification
      summary: Resubmit a rejected driver application
      description: TEST mode permits a reason-only resubmission. STRICT mode requires newly uploaded pending evidence since the previous review.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { description: Driver application returned to pending review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Application is not rejected or new evidence is required. }
  /drivers/me/documents:
    get:
      tags: [Drivers]
      operationId: listMyDriverVerificationDocuments
      summary: List private verification documents for the authenticated driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      responses:
        '200': { description: Driver's submitted document metadata. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Drivers]
      operationId: uploadMyDriverVerificationDocument
      summary: Upload a private driver or vehicle verification document
      description: Accepts JPEG, PNG, WebP or PDF files up to 10 MB. The file is uploaded as an octet stream; document type and file metadata are supplied in headers.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: X-File-Content-Type
          required: true
          schema: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
        - in: header
          name: X-File-Name
          required: true
          schema: { type: string, maxLength: 160 }
        - in: header
          name: X-Document-Type
          required: true
          schema: { type: string, enum: [IDENTITY, DRIVER_LICENSE, VEHICLE_REGISTRATION, VEHICLE_INSURANCE, ROADWORTHINESS] }
        - in: header
          name: X-Vehicle-ID
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '201': { description: Private document stored and queued for review. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: File exceeds the upload limit. }
        '415': { description: Unsupported upload content type. }
  /drivers/me/documents/{documentId}/download:
    get:
      tags: [Drivers]
      operationId: downloadMyDriverVerificationDocument
      summary: Download one of the authenticated driver's private verification documents
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Private document bytes with no-store cache policy. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/admin/documents:
    get:
      tags: [Admin]
      operationId: listDriverVerificationDocuments
      summary: List driver verification documents for Admin review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - in: query
          name: reviewStatus
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - in: query
          name: driverProfileId
          schema: { type: string, maxLength: 128 }
        - in: query
          name: vehicleId
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Paginated private document metadata with driver and vehicle context. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /drivers/admin/documents/{documentId}/review:
    patch:
      tags: [Admin]
      operationId: reviewDriverVerificationDocument
      summary: Approve or reject a driver verification document
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reviewStatus, reason]
              properties:
                reviewStatus: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, minLength: 10, maxLength: 500 }
      responses:
        '200': { description: Document review decision recorded and audited. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Document has already been reviewed. }
  /drivers/admin/documents/{documentId}/download:
    get:
      tags: [Admin]
      operationId: downloadDriverVerificationDocumentForReview
      summary: Download private driver verification evidence for Admin review
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: documentId
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '200': { description: Private document bytes; download is audited. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /drivers/availability:
    patch:
      tags: [Drivers]
      operationId: setDriverAvailability
      summary: Set online and available status for a verified driver
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [isOnline, isAvailable]
              properties:
                isOnline: { type: boolean }
                isAvailable: { type: boolean }
      responses:
        '200': { description: Updated online and available state. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Driver is not ready for dispatch. }
  /drivers/location:
    post:
      tags: [Drivers]
      operationId: recordDriverLocation
