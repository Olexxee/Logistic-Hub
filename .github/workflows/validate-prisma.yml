name: Validate Prisma Schema and PostgreSQL Constraints

concurrency:
  group: prisma-validation-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prisma-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: logistic_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d logistic_hub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/logistic_hub?schema=public
      PAYMENTS_ENABLED: "false"
      RUN_POSTGRES_INTEGRITY_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate Prisma schema
        run: npm run db:validate
      - name: Generate Prisma Client
        run: npm run db:generate
      - name: Validate OpenAPI contracts
        run: npm run api:validate
      - name: Generate disposable baseline SQL
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/logistic-hub-base.sql
      - name: Apply generated schema to disposable PostgreSQL
        run: npx prisma db execute --file /tmp/logistic-hub-base.sql --schema prisma/schema.prisma
      - name: Apply supplemental PostgreSQL constraints
        run: npx prisma db execute --file prisma/constraints/foundation.sql --schema prisma/schema.prisma
      - name: Package initial migration candidate for review
        if: success()
        run: cat /tmp/logistic-hub-base.sql prisma/constraints/foundation.sql > /tmp/logistic-hub-initial-migration.sql
      - name: Upload initial migration candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: logistic-hub-initial-migration-candidate
          path: /tmp/logistic-hub-initial-migration.sql
          retention-days: 1
      - name: Check schema drift against disposable PostgreSQL
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Run API and PostgreSQL integrity tests
        run: npm test
      - name: Commit generated initial migration to the feature branch
        if: success() && ((github.event_name == 'push' && github.ref_name == 'feat/backend-foundation') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/backend-foundation')) && hashFiles('prisma/migrations/*/migration.sql') == ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prisma/migrations/20261026121500_initial_foundation
          cp /tmp/logistic-hub-initial-migration.sql prisma/migrations/20261026121500_initial_foundation/migration.sql
          printf 'provider = "postgresql"\n' > prisma/migrations/migration_lock.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prisma/migrations/20261026121500_initial_foundation/migration.sql prisma/migrations/migration_lock.toml
          git commit -m "chore: add initial PostgreSQL migration"
          TARGET_BRANCH="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then TARGET_BRANCH="${{ github.event.pull_request.head.ref }}"; fi
          git push origin "HEAD:${TARGET_BRANCH}"
